name: Inspect The Files v0.2.25 storage hooks
on:
  push:
    paths:
      - '.github/workflows/the-files-inspect-storage-v0225.yml'
permissions:
  contents: write
jobs:
  inspect:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Extract storage and portrait hooks
        shell: python
        run: |
          from pathlib import Path
          import json,base64
          r=Path('.');m=json.loads((r/'the-files/manifest.json').read_text())
          b=b''.join((r/'the-files'/x['url'].rsplit('/',1)[-1]).read_bytes() for x in m['payloadParts'])
          p=json.loads(b.decode());fs={f['path']:f for f in p['files']};c=base64.b64decode(fs['TheFilesCore.ps1']['contentBase64']).decode('utf-8-sig').splitlines()
          keys=('DataDir','DataPath','Portrait','AppData','LOCALAPPDATA','CharacterFile','Save-Characters','Schedule-Save','OpenFileDialog','Image]::FromFile','PictureBox')
          out=[]
          for i,line in enumerate(c):
              if any(k.lower() in line.lower() for k in keys):
                  for j in range(max(0,i-2),min(len(c),i+3)):
                      out.append(f'{j+1}: {c[j]}')
                  out.append('---')
          (r/'tools/storage-hooks-v0.2.25.txt').write_text('\n'.join(out),encoding='utf-8')
      - name: Commit inspection
        shell: pwsh
        run: |
          git config user.name 'VeyrStudio Update Bot';git config user.email 'actions@users.noreply.github.com'
          git add tools/storage-hooks-v0.2.25.txt;git diff --cached --quiet
          if($LASTEXITCODE -ne 0){git commit -m 'Inspect The Files v0.2.25 storage hooks';git pull --rebase origin main;git push origin main}
