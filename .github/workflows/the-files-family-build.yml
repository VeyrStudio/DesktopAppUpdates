name: The Files Family Rebuild

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/the-files-family-build.yml'
      - 'tools/the-files-family-build.py'
      - 'tools/the-files-family-hotfix.py'
  pull_request:
    paths:
      - 'tools/the-files-family-build.py'
      - 'tools/the-files-family-hotfix.py'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build family release
        run: python tools/the-files-family-hotfix.py
      - name: Commit generated validation files
        if: github.event_name != 'pull_request'
        run: |
          git config user.name "VeyrStudio Update Bot"
          git config user.email "actions@users.noreply.github.com"
          git add the-files/
          if git diff --cached --quiet; then
            echo "No generated changes"
          else
            git commit -m "Validate The Files family rebuild"
            git push
          fi
