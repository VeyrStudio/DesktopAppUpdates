name: Build The Catalog Windows

on:
  push:
    branches:
      - catalog-build-v0-2
    paths:
      - 'the-catalog/build/**'
      - '.github/workflows/build-the-catalog-temp.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'the-catalog/build/**'
      - '.github/workflows/build-the-catalog-temp.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Reconstruct source archive
        shell: pwsh
        run: |
          $p0 = Get-Content 'the-catalog/build/source-part-00.b64' -Raw
          $p1 = Get-Content 'the-catalog/build/source-part-01.b64' -Raw
          $p2 = Get-Content 'the-catalog/build/source-part-02.b64' -Raw
          $bytes = [Convert]::FromBase64String($p0 + $p1 + $p2)
          [IO.File]::WriteAllBytes('TheCatalog-source.zip', $bytes)
          Expand-Archive -Path 'TheCatalog-source.zip' -DestinationPath 'catalog-source' -Force

      - name: Apply WPF compile fixes
        shell: pwsh
        run: |
          $root = 'catalog-source/TheCatalog-WPF-v0.3-runtime-src'

          $xaml = Join-Path $root 'MainWindow.xaml'
          $text = Get-Content $xaml -Raw
          $text = $text.Replace(' LineHeight="27"', '')
          Set-Content -Path $xaml -Value $text -Encoding utf8

          Get-ChildItem $root -Recurse -Filter '*.cs' | ForEach-Object {
            $source = Get-Content $_.FullName -Raw
            if ($source -notmatch '(?m)^using System\.IO;') {
              Set-Content -Path $_.FullName -Value ("using System.IO;`r`n" + $source) -Encoding utf8
            }
          }

          $db = Join-Path $root 'Data/CatalogDb.cs'
          $dbText = Get-Content $db -Raw
          $dbText = $dbText.Replace(
            'await using var transaction = await connection.BeginTransactionAsync();',
            'using var transaction = connection.BeginTransaction();'
          )
          Set-Content -Path $db -Value $dbText -Encoding utf8

      - name: Wire updater into The Catalog
        shell: pwsh
        run: ./the-catalog/build/patches/ApplyUpdater.ps1

      - name: Restore
        shell: pwsh
        run: dotnet restore 'catalog-source/TheCatalog-WPF-v0.3-runtime-src/TheCatalog.csproj'

      - name: Publish self-contained Windows app
        shell: pwsh
        run: |
          dotnet publish 'catalog-source/TheCatalog-WPF-v0.3-runtime-src/TheCatalog.csproj' `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:EnableCompressionInSingleFile=true `
            -p:DebugType=None `
            -p:DebugSymbols=false `
            -o 'publish/TheCatalog'

      - name: Verify executable
        shell: pwsh
        run: |
          if (!(Test-Path 'publish/TheCatalog/TheCatalog.exe')) { throw 'TheCatalog.exe was not produced.' }
          Get-Item 'publish/TheCatalog/TheCatalog.exe' | Format-List Name,Length,LastWriteTime
          Get-FileHash 'publish/TheCatalog/TheCatalog.exe' -Algorithm SHA256 | Format-List

      - name: Publish live updater release to main
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = '1.0.0'
          $exe = (Resolve-Path 'publish/TheCatalog/TheCatalog.exe').Path
          $exeBytes = [IO.File]::ReadAllBytes($exe)
          $base64 = [Convert]::ToBase64String($exeBytes)
          $utf8 = [Text.UTF8Encoding]::new($false)
          $sha = [Security.Cryptography.SHA256]::Create()

          function Get-Sha256Hex([byte[]]$bytes) {
            $hash = $sha.ComputeHash($bytes)
            return -join ($hash | ForEach-Object { $_.ToString('x2') })
          }

          $stage = Join-Path $PWD 'catalog-release-stage'
          $catalogStage = Join-Path $stage 'the-catalog'
          if (Test-Path $stage) { Remove-Item $stage -Recurse -Force }
          New-Item -ItemType Directory -Path $catalogStage -Force | Out-Null

          $payloadSha = Get-Sha256Hex ($utf8.GetBytes($base64))
          $partSize = 20000000
          $parts = @()
          $partIndex = 0
          for ($offset = 0; $offset -lt $base64.Length; $offset += $partSize) {
            $partIndex++
            $length = [Math]::Min($partSize, $base64.Length - $offset)
            $partText = $base64.Substring($offset, $length)
            $name = ('payload-{0}-part-{1:d3}.txt' -f $version, $partIndex)
            $path = Join-Path $catalogStage $name
            [IO.File]::WriteAllText($path, $partText, $utf8)
            $partSha = Get-Sha256Hex ($utf8.GetBytes($partText))
            $parts += [ordered]@{
              url = "https://raw.githubusercontent.com/VeyrStudio/DesktopAppUpdates/main/the-catalog/$name"
              sha256 = $partSha
            }
          }

          $manifest = [ordered]@{
            schemaVersion = 1
            appId = 'the-catalog-wpf'
            appName = 'The Catalog'
            version = $version
            payloadSha256 = $payloadSha
            payloadParts = $parts
            notes = 'First native WPF release of The Catalog with local story storage, mood boards, backups, automatic updates, and the manual Update button.'
          }
          [IO.File]::WriteAllText(
            (Join-Path $catalogStage 'manifest.json'),
            ($manifest | ConvertTo-Json -Depth 8),
            $utf8
          )

          $validation = [ordered]@{
            version = $version
            executableSha256 = Get-Sha256Hex $exeBytes
            executableBytes = $exeBytes.Length
            payloadSha256 = $payloadSha
            payloadBytes = $utf8.GetByteCount($base64)
            payloadPartCount = $parts.Count
          }
          [IO.File]::WriteAllText(
            (Join-Path $catalogStage '1.0.0-validation.json'),
            ($validation | ConvertTo-Json -Depth 5),
            $utf8
          )

          git fetch origin main
          if (Test-Path 'catalog-publish-main') { Remove-Item 'catalog-publish-main' -Recurse -Force }
          git worktree add 'catalog-publish-main' 'origin/main'
          $dest = Join-Path $PWD 'catalog-publish-main/the-catalog'
          New-Item -ItemType Directory -Path $dest -Force | Out-Null
          Get-ChildItem $dest -Filter 'payload-*.txt' -ErrorAction SilentlyContinue | Remove-Item -Force
          Copy-Item (Join-Path $catalogStage '*') $dest -Force

          Push-Location 'catalog-publish-main'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add the-catalog
          $changes = git status --porcelain
          if ($changes) {
            git commit -m "Release The Catalog WPF 1.0.0"
            git push origin HEAD:main
          }
          Pop-Location

      - name: Upload Windows app
        uses: actions/upload-artifact@v4
        with:
          name: TheCatalog-Windows-x64
          path: publish/TheCatalog/TheCatalog.exe
          if-no-files-found: error
          retention-days: 7
