name: The Library Batch Import v1.0.5
on:
  push:
    paths:
      - 'tools/the-library-batch-import-v105.py'
      - '.github/workflows/the-library-batch-import-v105.yml'
permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build exact v1.0.5 payload
        shell: pwsh
        run: python tools/the-library-batch-import-v105.py

      - name: Parse updater script with Windows PowerShell
        shell: powershell
        run: |
          $tokens=$null;$errors=$null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path '.library-v105-validation/CoverVault.ps1'),[ref]$tokens,[ref]$errors)|Out-Null
          if($errors.Count -gt 0){
            $errors|ForEach-Object{Write-Error (($_.Extent.StartLineNumber.ToString())+': '+$_.Message)}
            throw 'PowerShell parse failed.'
          }

      - name: Test patch against synthetic Library source
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $root=Join-Path $PWD '.library-v105-runtime'
          $app=Join-Path $root 'App'
          $backup=Join-Path $root 'UpdateBackup'
          New-Item -ItemType Directory -Force -Path $app,$backup|Out-Null

          @'
          Add-Type -AssemblyName System.Windows.Forms
          $form=New-Object System.Windows.Forms.Form
          $form.MinimumSize = New-Object System.Drawing.Size(520,420)
          $compact = $form.ClientSize.Width -lt 820
          $tabLibrary=New-Object System.Windows.Forms.TabPage
          $tabAdd=New-Object System.Windows.Forms.TabPage
          $tabSplit=New-Object System.Windows.Forms.TabPage
          $tabBackup=New-Object System.Windows.Forms.TabPage
          function Resize-CoverVaultLayout {}
          function Import-SingleImage {}
          function Load-ImageUnlocked([string]$Path){ return New-Object System.Drawing.Bitmap(1,1) }
          function Confirm-DuplicateImport([string]$Path){ return $true }
          function Copy-Or-Move-IntoVault([string]$Path,[bool]$Move){ return [IO.Path]::GetFileName($Path) }
          function Add-LibraryRecord { param($OriginalName,$StoredName,$Position,$Project,$Ship,$Fandom,$Tags) }
          function Refresh-HierarchyTree {}
          function Refresh-LibraryGrid {}
          function Show-Info([string]$Message) {}
          function Get-AutoSplit {}
          function New-Button([string]$Text,[int]$X,[int]$Y,[int]$W,[int]$H){
            $b=New-Object System.Windows.Forms.Button;$b.Text=$Text;return $b
          }
          $cmbSinglePosition=New-Object System.Windows.Forms.ComboBox
          $cmbSingleCoverType=New-Object System.Windows.Forms.ComboBox
          $txtSingleProject=New-Object System.Windows.Forms.TextBox
          $txtSingleShip=New-Object System.Windows.Forms.TextBox
          $txtSingleFandom=New-Object System.Windows.Forms.TextBox
          $txtSingleTags=New-Object System.Windows.Forms.TextBox
          $btnImportSingle = New-Button "SAVE IMAGE TO VAULT" 170 608 220 42
          $tabAdd.Controls.Add($btnImportSingle)
          [void]$form.ShowDialog()
          '@ | Set-Content -LiteralPath (Join-Path $backup 'CoverVault.ps1') -Encoding UTF8

          '{"version":"1.0.4"}' | Set-Content -LiteralPath (Join-Path $backup 'AppVersion.json') -Encoding UTF8
          Copy-Item '.library-v105-validation/CoverVault.ps1' (Join-Path $app 'CoverVault.ps1')

          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File (Join-Path $app 'CoverVault.ps1')
          if($LASTEXITCODE -ne 0){throw 'Updater patch returned failure.'}

          $patched=Get-Content -LiteralPath (Join-Path $app 'CoverVault.ps1') -Raw
          foreach($marker in @(
            '# BATCH COVER IMPORT v1.0.5',
            'function Import-MultipleImages',
            '$dlg.Multiselect = $true',
            'IMPORT MULTIPLE IMAGES',
            'Copy-Or-Move-IntoVault $source $false',
            '# SPLIT SCREEN HARDENING v1.0.4',
            'Size(420,360)',
            'Width -lt 720'
          )){
            if(-not $patched.Contains($marker)){throw "Missing patched marker: $marker"}
          }

          $tokens=$null;$errors=$null
          [System.Management.Automation.Language.Parser]::ParseFile((Join-Path $app 'CoverVault.ps1'),[ref]$tokens,[ref]$errors)|Out-Null
          if($errors.Count -gt 0){
            $errors|ForEach-Object{Write-Error $_.Message}
            throw 'Patched Library source does not parse.'
          }

          $ver=Get-Content -LiteralPath (Join-Path $app 'AppVersion.json') -Raw|ConvertFrom-Json
          if([string]$ver.version -ne '1.0.5'){throw 'Patched AppVersion is not 1.0.5.'}

      - name: Revalidate payload and hashes
        shell: python
        run: |
          import base64,hashlib,json,pathlib
          root=pathlib.Path('.')
          v=json.loads((root/'the-library/batch-import-1.0.5-validation.json').read_text())
          b=(root/'the-library'/v['payload']).read_bytes()
          assert hashlib.sha256(b).hexdigest()==v['payloadSha256']
          p=json.loads(b.decode())
          assert p['version']=='1.0.5'
          assert {f['path'] for f in p['files']}=={'CoverVault.ps1','AppVersion.json'}
          for f in p['files']:
              d=base64.b64decode(f['contentBase64'])
              assert hashlib.sha256(d).hexdigest()==f['sha256'],f['path']

      - name: Mark validation and commit exact payload
        shell: pwsh
        run: |
          $p='the-library/batch-import-1.0.5-validation.json'
          $r=Get-Content $p -Raw|ConvertFrom-Json
          $r|Add-Member -NotePropertyName powershellParse -NotePropertyValue 'passed-windows-powershell-parser' -Force
          $r|Add-Member -NotePropertyName syntheticPatchTest -NotePropertyValue 'passed' -Force
          $r|ConvertTo-Json -Depth 10|Set-Content $p -Encoding UTF8
          git config user.name 'VeyrStudio Update Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add 'the-library/payload-1.0.5-batch-import.txt' 'the-library/batch-import-1.0.5-validation.json'
          git diff --cached --quiet
          if($LASTEXITCODE -ne 0){
            git commit -m 'Stage validated The Library v1.0.5 batch import'
            git pull --rebase origin main
            git push origin main
          }
