name: Inspect The Files v0.2.23 internal hashes
on:
  push:
    paths:
      - '.github/workflows/the-files-inspect-v0223-internal-hashes.yml'
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Inspect payload file verification metadata
        shell: python
        run: |
          from pathlib import Path
          import json,base64,hashlib
          r=Path('.')
          m=json.loads((r/'the-files/manifest.json').read_text())
          b=b''.join((r/'the-files'/p['url'].rsplit('/',1)[-1]).read_bytes() for p in m['payloadParts'])
          p=json.loads(b.decode())
          lines=[]
          for f in p['files']:
              raw=base64.b64decode(f['contentBase64'])
              lines.append(f"{f['path']} keys={sorted(f.keys())} actualSha256={hashlib.sha256(raw).hexdigest()} metadata="+json.dumps({k:v for k,v in f.items() if k!='contentBase64'},sort_keys=True))
          (r/'tools/v0223-internal-hashes.txt').write_text('\n'.join(lines),encoding='utf-8')
      - name: Commit inspection
        shell: bash
        run: |
          git config user.name 'VeyrStudio Update Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add tools/v0223-internal-hashes.txt
          if ! git diff --cached --quiet; then
            git commit -m 'Inspect The Files v0.2.23 internal hashes'
            git pull --rebase origin main
            git push origin main
          fi
