name: Inspect The Files v0.2.30 visual shell B
on:
  push:
    paths:
      - '.github/workflows/the-files-inspect-visual-shell-v0230b.yml'
permissions:
  contents: write
jobs:
  inspect:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Extract exact visual regions
        shell: python
        run: |
          from pathlib import Path
          import json,base64,re
          r=Path('.')
          p=json.loads((r/'the-files/payload-0.2.30-color-reader-fix-part-001.txt').read_text())
          fs={f['path']:f for f in p['files']}
          raw=base64.b64decode(fs['TheFilesCore.ps1']['contentBase64'])
          text=raw.decode('utf-8-sig')
          lines=text.splitlines()
          pats=[r'New-Object System\.Windows\.Forms\.Form',r'New-Object System\.Windows\.Forms\.Panel',r'New-Object System\.Windows\.Forms\.Button',r'New-Object System\.Windows\.Forms\.TextBox',r'New-Object System\.Windows\.Forms\.SplitContainer',r'BackColor',r'ForeColor',r'Font',r'Render-CurrentCharacter',r'Refresh-Navigation',r'Previous',r'Next',r'Overview']
          hits=[]
          for i,line in enumerate(lines):
              if any(re.search(pat,line,re.I) for pat in pats):
                  s=max(0,i-3);e=min(len(lines),i+10)
                  hits.append('\n'.join(f'{j+1}: {lines[j]}' for j in range(s,e)))
          head='SOURCE_BYTES='+str(len(raw))+'\nSOURCE_LINES='+str(len(lines))+'\nHITS='+str(len(hits))+'\n\n'
          (r/'tools/current-visual-shell-v0.2.30b.txt').write_text(head+'\n\n---\n\n'.join(hits[:250]),encoding='utf-8')
      - name: Commit inspection
        shell: pwsh
        run: |
          git config user.name 'VeyrStudio Update Bot';git config user.email 'actions@users.noreply.github.com'
          git add 'tools/current-visual-shell-v0.2.30b.txt';git diff --cached --quiet
          if($LASTEXITCODE -ne 0){git commit -m 'Inspect The Files v0.2.30 visual shell exact';git pull --rebase origin main;git push origin main}
