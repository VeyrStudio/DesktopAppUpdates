name: The Library Unified Full Wrap Picker v1.0.14
on:
  push:
    paths:
      - 'tools/the-library-unified-full-wrap-picker-v114.py'
      - '.github/workflows/the-library-unified-full-wrap-picker-v114.yml'
permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build exact v1.0.14 payload
        shell: pwsh
        run: python tools/the-library-unified-full-wrap-picker-v114.py

      - name: Parse patcher and unified drop-in
        shell: powershell
        run: |
          foreach($path in @(
            '.library-v114-validation/CoverVault.ps1',
            '.library-v114-validation/BatchSplitDropIn.ps1'
          )){
            $tokens=$null;$errors=$null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $path),[ref]$tokens,[ref]$errors)|Out-Null
            if($errors.Count -gt 0){
              $errors|ForEach-Object{Write-Error ($path+' line '+$_.Extent.StartLineNumber+': '+$_.Message)}
              throw "PowerShell parse failed: $path"
            }
          }

      - name: Test one-button one-or-many workflow
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $root=Join-Path $PWD '.library-v114-runtime'
          $app=Join-Path $root 'App'
          $backup=Join-Path $root 'UpdateBackup'
          $data=Join-Path $root 'Data'
          New-Item -ItemType Directory -Force -Path $app,$backup,$data|Out-Null

          @'
          Add-Type -AssemblyName System.Windows.Forms
          Add-Type -AssemblyName System.Drawing

          $appRoot=Split-Path -Parent $PSScriptRoot
          $form=New-Object Windows.Forms.Form
          $form.Size=New-Object Drawing.Size(1300,1000)
          $tabs=New-Object Windows.Forms.TabControl
          $tabs.Dock='Fill'
          $form.Controls.Add($tabs)
          $tabSplit=New-Object Windows.Forms.TabPage
          $tabSplit.Text='Split'
          $tabs.TabPages.Add($tabSplit)

          $script:TestRecords=New-Object Collections.Generic.List[object]

          function Add-LibraryRecord {
              param($OriginalName,$StoredName,$Position,$Project,$Ship,$Fandom,$Tags)
              $script:TestRecords.Add([pscustomobject]@{
                  OriginalName=$OriginalName
                  StoredName=$StoredName
                  Position=$Position
                  Project=$Project
                  Ship=$Ship
                  Fandom=$Fandom
                  Tags=$Tags
              })
          }

          function Copy-Or-Move-IntoVault([string]$Path,[bool]$Move){
              $destDir=Join-Path $appRoot 'Data'
              New-Item -ItemType Directory -Force -Path $destDir|Out-Null
              $name=[guid]::NewGuid().ToString('N')+[IO.Path]::GetExtension($Path)
              Copy-Item -LiteralPath $Path -Destination (Join-Path $destDir $name) -Force
              return $name
          }

          function Refresh-HierarchyTree {}
          function Refresh-LibraryGrid {}
          function ExistingSingleSplitSentinel { return 'still-here' }

          $regular=New-Object Windows.Forms.Button
          $regular.Name='ExistingChooseFullCoverButton'
          $regular.Text='CHOOSE FULL COVER'
          $regular.Location=New-Object Drawing.Point(22,18)
          $regular.Size=New-Object Drawing.Size(190,36)
          $regular.Add_Click({ throw 'OLD SINGLE HANDLER SHOULD NOT RUN' })
          $tabSplit.Controls.Add($regular)

          $oldMulti=New-Object Windows.Forms.Button
          $oldMulti.Name='OldMulti'
          $oldMulti.Text='ADD MULTIPLE FULL WRAPS'
          $oldMulti.Location=New-Object Drawing.Point(230,18)
          $oldMulti.Size=New-Object Drawing.Size(210,36)
          $oldMulti.Add_Click({ throw 'OLD MULTI HANDLER SHOULD NOT RUN' })
          $tabSplit.Controls.Add($oldMulti)

          [void]$form.ShowDialog()
          '@ | Set-Content -LiteralPath (Join-Path $backup 'CoverVault.ps1') -Encoding UTF8

          '{"version":"1.0.13"}' | Set-Content -LiteralPath (Join-Path $backup 'AppVersion.json') -Encoding UTF8
          Copy-Item '.library-v114-validation/CoverVault.ps1' (Join-Path $app 'CoverVault.ps1')
          Copy-Item '.library-v114-validation/BatchSplitDropIn.ps1' (Join-Path $app 'BatchSplitDropIn.ps1')

          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File (Join-Path $app 'CoverVault.ps1')
          if($LASTEXITCODE -ne 0){throw 'Unified picker updater failed.'}

          $patchedPath=Join-Path $app 'CoverVault.ps1'
          $patched=Get-Content -LiteralPath $patchedPath -Raw
          if(-not $patched.Contains('Initialize-LibraryBatchSplitDropIn')){throw 'Drop-in startup hook missing.'}
          if(-not $patched.Contains('function ExistingSingleSplitSentinel')){throw 'Existing single splitter area was disturbed.'}

          $runtimePath=Join-Path $app 'runtime-test.ps1'
          $runtime=$patched.Replace('[void]$form.ShowDialog()','# modal startup disabled for automated test')
          $runtime += @'

          if((ExistingSingleSplitSentinel) -ne 'still-here'){throw 'Existing split code was altered.'}

          $allButtons=@(Get-LibraryAllChildControls $tabSplit|Where-Object{$_ -is [Windows.Forms.Button]})
          $unified=@($allButtons|Where-Object{$_.Name -eq 'LibraryUnifiedFullWrapButton'})
          if($unified.Count -ne 1){throw ("Expected exactly one unified full-wrap button, got "+$unified.Count)}
          if($unified[0].Text -ne 'CHOOSE FULL COVER'){throw 'Regular full-cover button text was not preserved.'}

          $separate=@($allButtons|Where-Object{
              $u=([string]$_.Text).ToUpperInvariant()
              $u.Contains('MULTIPLE') -or $u.Contains('BATCH SPLIT')
          })
          if($separate.Count -ne 0){throw 'A separate batch/multiple button still exists.'}

          $testDir=Join-Path $env:TEMP ('TheLibrary-v114-'+[guid]::NewGuid().ToString('N'))
          New-Item -ItemType Directory -Force -Path $testDir|Out-Null
          $paths=New-Object Collections.Generic.List[string]

          try{
              for($i=1;$i -le 5;$i++){
                  $path=Join-Path $testDir ("cover-$i.png")
                  $bmp=New-Object Drawing.Bitmap((1200+$i*80),(800+$i*30),[Drawing.Imaging.PixelFormat]::Format32bppArgb)
                  try{
                      $g=[Drawing.Graphics]::FromImage($bmp)
                      try{$g.Clear([Drawing.Color]::FromArgb(255,50+$i*20,25,130))}finally{$g.Dispose()}
                      $bmp.Save($path,[Drawing.Imaging.ImageFormat]::Png)
                  }finally{$bmp.Dispose()}
                  $paths.Add($path)
              }

              # One file through the exact same unified path.
              Show-LibraryUnifiedWrapPaths @($paths[0])
              $host=$script:LibraryUnifiedWrapHost
              if($null -eq $host -or $host.Controls.Count -ne 1){throw 'Single-file unified flow did not create exactly one panel.'}
              $single=$host.Controls[0]
              if($null -eq $single.Tag -or $null -eq $single.Tag.Bitmap){throw 'Single-file panel state is null.'}
              $single.Tag.Project.Text='Single Book'
              $single.Tag.CoverType.Text='Paperback'

              $form.Show()
              for($i=0;$i -lt 8;$i++){[Windows.Forms.Application]::DoEvents();Start-Sleep -Milliseconds 40}
              $single.Tag.Pic.Invalidate()
              for($i=0;$i -lt 4;$i++){[Windows.Forms.Application]::DoEvents();Start-Sleep -Milliseconds 40}
              Save-LibraryDropInCover $single.Tag

              if($script:TestRecords.Count -ne 3){throw ("Single file should create 3 pieces, got "+$script:TestRecords.Count)}

              # Five files through the same path.
              Show-LibraryUnifiedWrapPaths @($paths)
              $host=$script:LibraryUnifiedWrapHost
              if($null -eq $host -or $host.Controls.Count -ne 5){throw 'Five-file unified flow did not create five panels.'}

              $n=0
              foreach($panel in @($host.Controls)){
                  $n++
                  if($null -eq $panel.Tag -or $null -eq $panel.Tag.Bitmap){throw ("Panel $n state is null.")}
                  $panel.Tag.Project.Text=("Book $n")
                  $panel.Tag.Ship.Text=("Ship $n")
                  $panel.Tag.Fandom.Text=("Fandom $n")
                  $panel.Tag.Tags.Text='batch,test'
                  $panel.Tag.CoverType.Text='Paperback'
                  $panel.Tag.Pic.Invalidate()
                  $panel.Tag.LeftNum.Value=[decimal]([math]::Max(1,[int]$panel.Tag.LeftNum.Value-2))
                  $panel.Tag.RightNum.Value=[decimal]([math]::Min([int]$panel.Tag.RightNum.Maximum,[int]$panel.Tag.RightNum.Value+2))
              }

              for($i=0;$i -lt 8;$i++){[Windows.Forms.Application]::DoEvents();Start-Sleep -Milliseconds 40}

              foreach($panel in @($host.Controls)){
                  Save-LibraryDropInCover $panel.Tag
              }

              if($script:TestRecords.Count -ne 18){
                  throw ("Expected 18 total records after 1+5 covers, got "+$script:TestRecords.Count)
              }

              $form.Close()
          }
          finally{
              Remove-Item -LiteralPath $testDir -Force -Recurse -ErrorAction SilentlyContinue
          }
          '@

          $runtime | Set-Content -LiteralPath $runtimePath -Encoding UTF8
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File $runtimePath
          if($LASTEXITCODE -ne 0){throw 'Unified one-or-many runtime test failed.'}

          $ver=Get-Content -LiteralPath (Join-Path $app 'AppVersion.json') -Raw|ConvertFrom-Json
          if([string]$ver.version -ne '1.0.14'){throw 'Patched AppVersion is not 1.0.14.'}

      - name: Revalidate payload and hashes
        shell: python
        run: |
          import base64,hashlib,json,pathlib
          root=pathlib.Path('.')
          v=json.loads((root/'the-library/unified-full-wrap-picker-1.0.14-validation.json').read_text())
          b=(root/'the-library'/v['payload']).read_bytes()
          assert hashlib.sha256(b).hexdigest()==v['payloadSha256']
          p=json.loads(b.decode())
          assert p['version']=='1.0.14'
          for f in p['files']:
              d=base64.b64decode(f['contentBase64'])
              assert hashlib.sha256(d).hexdigest()==f['sha256'],f['path']

      - name: Mark validation and commit exact payload
        shell: pwsh
        run: |
          $p='the-library/unified-full-wrap-picker-1.0.14-validation.json'
          $r=Get-Content $p -Raw|ConvertFrom-Json
          $r|Add-Member -NotePropertyName powershellParse -NotePropertyValue 'passed-windows-powershell-parser' -Force
          $r|Add-Member -NotePropertyName oneButtonUiTest -NotePropertyValue 'passed' -Force
          $r|Add-Member -NotePropertyName oneCoverRuntimeTest -NotePropertyValue 'passed' -Force
          $r|Add-Member -NotePropertyName fiveCoverRuntimeTest -NotePropertyValue 'passed' -Force
          $r|Add-Member -NotePropertyName eighteenPieceSaveTest -NotePropertyValue 'passed' -Force
          $r|ConvertTo-Json -Depth 10|Set-Content $p -Encoding UTF8

          git config user.name 'VeyrStudio Update Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add 'the-library/payload-1.0.14-unified-full-wrap-picker.txt' 'the-library/unified-full-wrap-picker-1.0.14-validation.json'
          git diff --cached --quiet
          if($LASTEXITCODE -ne 0){
            git commit -m 'Stage validated The Library v1.0.14 unified full-wrap picker'
            git pull --rebase origin main
            git push origin main
          }
