name: Build The Files Direct Repair ZIP
on:
  push:
    paths:
      - '.github/workflows/the-files-direct-repair-zip.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build direct repair ZIP from validated v0.2.19 payload
        shell: pwsh
        run: |
          python -c "import json,base64,hashlib,pathlib,zipfile; root=pathlib.Path('.'); p=root/'the-files/payload-0.2.19-powers-contrast-rescue-part-001.txt'; b=p.read_bytes(); assert hashlib.sha256(b).hexdigest()=='8e8f4a4527c185734279c418246f27d02938294d51f460a4f404e6362bf32b56'; x=json.loads(b.decode()); fs={f['path']:f for f in x['files']}; need=['TheFiles.ps1','TheFilesCore.ps1','TheFilesCore.ps1.gz','AppVersion.json']; out=root/'the-files/The-Files-v0.2.19-Direct-Repair.zip'; z=zipfile.ZipFile(out,'w',zipfile.ZIP_DEFLATED); [(lambda d,n:(hashlib.sha256(d).hexdigest()==fs[n]['sha256'] or (_ for _ in ()).throw(Exception('sha '+n)),z.writestr(n,d)))(base64.b64decode(fs[n]['contentBase64']),n) for n in need]; z.close(); print(out, out.stat().st_size)"
      - name: Verify ZIP contents
        shell: pwsh
        run: |
          python -c "import zipfile,pathlib; z=zipfile.ZipFile(pathlib.Path('the-files/The-Files-v0.2.19-Direct-Repair.zip')); assert set(z.namelist())=={'TheFiles.ps1','TheFilesCore.ps1','TheFilesCore.ps1.gz','AppVersion.json'}; print(z.namelist())"
      - name: Commit repair ZIP
        shell: pwsh
        run: |
          git config user.name 'VeyrStudio Update Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add 'the-files/The-Files-v0.2.19-Direct-Repair.zip'
          git diff --cached --quiet
          if($LASTEXITCODE -ne 0){
            git commit -m 'Add direct repair ZIP for The Files v0.2.19'
            git pull --rebase origin main
            git push origin main
          }
