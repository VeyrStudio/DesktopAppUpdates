name: Build The Library WPF

on:
  workflow_dispatch:
  push:
    paths:
      - "the-library/wpf-src/**"
      - ".github/workflows/build-the-library-wpf.yml"

permissions:
  contents: write

env:
  LIBRARY_VERSION: "2.0.2"

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Publish self-contained WPF app
        shell: pwsh
        run: dotnet publish the-library/wpf-src/TheLibrary.Wpf/TheLibrary.Wpf.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o publish
      - name: Verify output
        shell: pwsh
        run: |
          if (-not (Test-Path publish/TheLibrary.exe)) { throw "TheLibrary.exe was not produced." }
          Get-FileHash publish/TheLibrary.exe -Algorithm SHA256
      - name: Build verified migration update
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $channel = Join-Path $PWD 'the-library'
          $version = $env:LIBRARY_VERSION
          $exe = Join-Path $PWD 'publish/TheLibrary.exe'
          $appVersion = [ordered]@{
            appId = 'the-library'
            appName = 'The Library'
            version = $version
            manifestUrl = 'https://raw.githubusercontent.com/VeyrStudio/DesktopAppUpdates/main/the-library/manifest.json'
          } | ConvertTo-Json -Depth 4
          $bridge = @'
          $ErrorActionPreference = 'Stop'
          $exe = Join-Path $PSScriptRoot 'TheLibrary.exe'
          if (-not (Test-Path -LiteralPath $exe)) { throw 'TheLibrary.exe is missing.' }
          Start-Process -FilePath $exe
          '@

          $entries = @(
            [ordered]@{
              path = 'TheLibrary.exe'
              sha256 = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLowerInvariant()
              contentBase64 = [Convert]::ToBase64String([IO.File]::ReadAllBytes($exe))
            },
            [ordered]@{
              path = 'CoverVault.ps1'
              sha256 = ([Convert]::ToHexString([Security.Cryptography.SHA256]::HashData([Text.Encoding]::UTF8.GetBytes($bridge)))).ToLowerInvariant()
              contentBase64 = [Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes($bridge))
            },
            [ordered]@{
              path = 'AppVersion.json'
              sha256 = ([Convert]::ToHexString([Security.Cryptography.SHA256]::HashData([Text.Encoding]::UTF8.GetBytes($appVersion)))).ToLowerInvariant()
              contentBase64 = [Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes($appVersion))
            }
          )
          $payload = [ordered]@{
            schemaVersion = 1
            appId = 'the-library'
            appName = 'The Library'
            version = $version
            files = $entries
            delete = @()
          } | ConvertTo-Json -Depth 8 -Compress
          $payloadBytes = [Text.Encoding]::UTF8.GetBytes($payload)
          $payloadHash = ([Convert]::ToHexString([Security.Cryptography.SHA256]::HashData($payloadBytes))).ToLowerInvariant()

          Get-ChildItem $channel -Filter "payload-$version-wpf-part-*.txt" -ErrorAction SilentlyContinue | Remove-Item -Force
          $partSize = 20MB
          $parts = @()
          for ($offset = 0; $offset -lt $payloadBytes.Length; $offset += $partSize) {
            $count = [Math]::Min($partSize, $payloadBytes.Length - $offset)
            $partNumber = $parts.Count + 1
            $name = "payload-$version-wpf-part-{0:000}.txt" -f $partNumber
            $path = Join-Path $channel $name
            $slice = New-Object byte[] $count
            [Array]::Copy($payloadBytes, $offset, $slice, 0, $count)
            [IO.File]::WriteAllBytes($path, $slice)
            $partHash = ([Convert]::ToHexString([Security.Cryptography.SHA256]::HashData($slice))).ToLowerInvariant()
            $parts += [ordered]@{
              url = "https://raw.githubusercontent.com/VeyrStudio/DesktopAppUpdates/main/the-library/$name"
              sha256 = $partHash
            }
          }

          $manifest = [ordered]@{
            schemaVersion = 1
            appId = 'the-library'
            appName = 'The Library'
            version = $version
            payloadSha256 = $payloadHash
            payloadParts = $parts
            notes = 'The Library 2.0.2 applies the private-archive visual redesign from the approved mockups: patterned black leather surfaces, antique-brass frames and controls, warm ivory serif typography, gold plaque primary actions, refined archive cards, a framed archive-record panel, a dedicated Add & Edit workbench with upload queue and centered preview or splitter, and the matching Settings layout. Add & Edit temporarily uses the full window workspace while preserving native Windows title-bar movement and snapping. Existing cover data, imports, splitting, zoom, drag guides, Save All, backups, archive actions, and independent verified updates are preserved.'
          } | ConvertTo-Json -Depth 8
          [IO.File]::WriteAllText((Join-Path $channel 'manifest.json'), $manifest, (New-Object Text.UTF8Encoding($false)))

          $validation = [ordered]@{
            version = $version
            builtFrom = $env:GITHUB_SHA
            executableSha256 = $entries[0].sha256
            executableBytes = (Get-Item $exe).Length
            payloadSha256 = $payloadHash
            payloadBytes = $payloadBytes.Length
            payloadPartCount = $parts.Count
            files = @($entries | ForEach-Object { [ordered]@{ path=$_.path; sha256=$_.sha256 } })
          } | ConvertTo-Json -Depth 8
          [IO.File]::WriteAllText((Join-Path $channel "wpf-migration-$version-validation.json"), $validation, (New-Object Text.UTF8Encoding($false)))
      - name: Publish migration update to channel
        shell: pwsh
        run: |
          git config user.name "VeyrStudio Update Builder"
          git config user.email "actions@users.noreply.github.com"
          git add the-library/manifest.json the-library/payload-${env:LIBRARY_VERSION}-wpf-part-*.txt the-library/wpf-migration-${env:LIBRARY_VERSION}-validation.json
          if (git diff --cached --quiet) { exit 0 }
          git commit -m "Release The Library ${env:LIBRARY_VERSION} WPF migration"
          git push origin HEAD:main
      - uses: actions/upload-artifact@v4
        with:
          name: TheLibrary-WPF-win-x64
          path: publish/TheLibrary.exe
          if-no-files-found: error
