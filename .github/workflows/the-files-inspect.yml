name: The Files Inspect
on:
  push:
    paths:
      - 'scripts/**'
      - '.github/workflows/the-files-inspect.yml'
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build Relationships candidate
        run: python scripts/run_build_relationships_0216.py
      - name: Upload candidate
        uses: actions/upload-artifact@v4
        with:
          name: the-files-relationships-0.2.16
          path: build-out/
