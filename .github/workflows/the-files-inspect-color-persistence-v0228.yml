name: Inspect The Files v0.2.28 color persistence
on:
  push:
    paths:
      - '.github/workflows/the-files-inspect-color-persistence-v0228.yml'
permissions:
  contents: write
jobs:
  inspect:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Extract color and save functions
        shell: python
        run: |
          from pathlib import Path
          import json,base64
          r=Path('.');m=json.loads((r/'the-files/manifest.json').read_text())
          b=b''.join((r/'the-files'/p['url'].rsplit('/',1)[-1]).read_bytes() for p in m['payloadParts'])
          p=json.loads(b.decode());fs={f['path']:f for f in p['files']};c=base64.b64decode(fs['TheFilesCore.ps1']['contentBase64']).decode('utf-8-sig').splitlines()
          keys=['function Set-NotesStringArray','function Add-NotesStringItem','function Get-NotesPaletteArray','function Add-NotesColor','function Mark-CharacterChanged','function Save-AllData','function Schedule-Save','ColorDialog','CustomColors','ColorPalette']
          out=[]
          for i,line in enumerate(c):
            if any(k in line for k in keys):
              s=max(0,i-4);e=min(len(c),i+18)
              out.append('\n'.join(f'{j+1}: {c[j]}' for j in range(s,e)))
          (r/'tools/current-color-persistence-v0.2.28.txt').write_text('\n\n---\n\n'.join(out),encoding='utf-8')
      - name: Commit inspection
        shell: pwsh
        run: |
          git config user.name 'VeyrStudio Update Bot';git config user.email 'actions@users.noreply.github.com'
          git add tools/current-color-persistence-v0.2.28.txt;git diff --cached --quiet
          if($LASTEXITCODE -ne 0){git commit -m 'Inspect The Files v0.2.28 color persistence';git pull --rebase origin main;git push origin main}
