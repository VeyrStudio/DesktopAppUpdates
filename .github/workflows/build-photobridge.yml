name: Build PhotoBridge
on:
  push:
    branches: [main]
    paths:
      - 'photobridge/**'
      - '.github/workflows/build-photobridge.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: photobridge-release
  cancel-in-progress: false
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Configure version
        shell: pwsh
        run: |
          $version = "0.1.${{ github.run_number }}"
          "PHOTOBRIDGE_VERSION=$version" >> $env:GITHUB_ENV
          (Get-Content photobridge/updater.py -Raw).Replace("VERSION = '1.0.0'", "VERSION = '$version'") | Set-Content photobridge/updater.py
      - name: Package Windows GUI
        shell: pwsh
        working-directory: photobridge
        run: |
          python -m pip install pyinstaller==6.16.0
          python -m py_compile PhotoBridge.py PhotoBridgeDesktop.py updater.py
          pyinstaller --clean --noconfirm PhotoBridge.spec
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress
      - name: Build installer
        shell: pwsh
        working-directory: photobridge
        run: '& "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" installer.iss'
      - name: Verify and prepare update manifest
        shell: pwsh
        run: |
          $v = $env:PHOTOBRIDGE_VERSION
          $tag = "photobridge-v$v"
          $asset = "PhotoBridge-Setup-$v.exe"
          $path = "photobridge/dist/$asset"
          if (-not (Test-Path $path)) { throw "Missing installer" }
          $hash = (Get-FileHash $path -Algorithm SHA256).Hash.ToLowerInvariant()
          [ordered]@{ version=$v; url="https://github.com/${{ github.repository }}/releases/download/$tag/$asset"; sha256=$hash; publishedAt=(Get-Date).ToUniversalTime().ToString('o') } | ConvertTo-Json | Set-Content photobridge/latest.json -Encoding utf8
          "PB_TAG=$tag" >> $env:GITHUB_ENV
          "PB_ASSET=$path" >> $env:GITHUB_ENV
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: PhotoBridge-Windows-${{ env.PHOTOBRIDGE_VERSION }}
          path: photobridge/dist/PhotoBridge-Setup-*.exe
      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$env:PB_TAG" "$env:PB_ASSET" --repo "${{ github.repository }}" --title "PhotoBridge $env:PHOTOBRIDGE_VERSION" --notes "Windows PhotoBridge installer."
      - name: Update PhotoBridge channel
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add photobridge/latest.json
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m "PhotoBridge updater: $env:PHOTOBRIDGE_VERSION [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          }
