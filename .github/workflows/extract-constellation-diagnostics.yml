name: Extract Constellation Diagnostics

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/extract-constellation-diagnostics.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Reconstruct Constellation source
        shell: pwsh
        run: |
          $parts = @(
            "apps/constellation/.source-parts/01.txt",
            "apps/constellation/.source-parts/02.txt",
            "apps/constellation/.source-parts/03.txt",
            "apps/constellation/.source-parts/04.txt",
            "apps/constellation/.source-parts/05.txt"
          )
          foreach ($part in $parts) { if (-not (Test-Path $part)) { throw "Missing source part: $part" } }
          $encoded = ($parts | ForEach-Object { Get-Content $_ -Raw }) -join ""
          $archive = Join-Path $env:RUNNER_TEMP "constellation_source.tar.xz"
          [IO.File]::WriteAllBytes($archive, [Convert]::FromBase64String($encoded))
          tar -xJf $archive -C "apps/constellation"

      - name: Publish temporary diagnostic source
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "diagnostics/constellation" | Out-Null
          Copy-Item "apps/constellation/src/app.js" "diagnostics/constellation/app.js" -Force
          Copy-Item "apps/constellation/src/index.html" "diagnostics/constellation/index.html" -Force
          Copy-Item "apps/constellation/src/styles.css" "diagnostics/constellation/styles.css" -Force
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add diagnostics/constellation
          git commit -m "Temporary Constellation diagnostic source [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
