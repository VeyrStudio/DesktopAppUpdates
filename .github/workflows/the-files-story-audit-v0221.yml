name: The Files Story Audit v0.2.21
on:
  push:
    paths:
      - 'tools/the-files-story-audit-v0221.py'
      - '.github/workflows/the-files-story-audit-v0221.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build cumulative Story release
        shell: pwsh
        run: python tools/the-files-story-audit-v0221.py
      - name: Parse launcher and core under Windows PowerShell
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          foreach($f in @('.story-v0221-validation/TheFiles.ps1','.story-v0221-validation/TheFilesCore.ps1')){
            $tokens=$null;$errors=$null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $f),[ref]$tokens,[ref]$errors)|Out-Null
            if($errors.Count -gt 0){$errors|ForEach-Object{Write-Error (($_.Extent.StartLineNumber.ToString())+': '+$_.Message)};throw "PowerShell parse failed: $f"}
          }
          $p='the-files/story-0.2.21-validation.json'
          $r=Get-Content $p -Raw|ConvertFrom-Json
          $r|Add-Member -NotePropertyName powershellParse -NotePropertyValue 'passed-windows-powershell-parser' -Force
          $r|ConvertTo-Json -Depth 10|Set-Content $p -Encoding UTF8
      - name: Revalidate payload and Story surface
        shell: pwsh
        run: |
          python -c "import json,pathlib,hashlib,base64,gzip,re; r=pathlib.Path('.'); v=json.loads((r/'the-files/story-0.2.21-validation.json').read_text(encoding='utf-8-sig')); b=(r/'the-files'/v['payload']).read_bytes(); assert hashlib.sha256(b).hexdigest()==v['payloadSha256']; p=json.loads(b.decode()); assert p['version']=='0.2.21'; fs={f['path']:f for f in p['files']}; assert {'TheFiles.ps1','TheFilesCore.ps1','TheFilesCore.ps1.gz','AppVersion.json'}<=set(fs); raw=base64.b64decode(fs['TheFilesCore.ps1']['contentBase64']); assert gzip.decompress(base64.b64decode(fs['TheFilesCore.ps1.gz']['contentBase64']))==raw; c=raw.decode('utf-8-sig'); s=re.search(r\"    'Story' = @\\((.*?)\\n    \\)\\n    'Timeline'\",c,re.S).group(1); req=['CharacterTier','Motivation','InternalConflict','ExternalConflict','FatalFlaw','Archetype','BeginningState','MiddleState','EndingState','PlotRelevance']; assert all(s.count(\"Key='\"+k+\"'\")==1 for k in req); assert \"Key='StoryRole'\" not in s; assert \"Label='Story Role'\" in c; print('Story surface and package validated')"
      - name: Commit validated payload and report only
        shell: pwsh
        run: |
          git config user.name 'VeyrStudio Update Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add 'the-files/payload-0.2.21-story-audit-part-001.txt' 'the-files/story-0.2.21-validation.json'
          git diff --cached --quiet
          if($LASTEXITCODE -ne 0){git commit -m 'Stage validated The Files v0.2.21 Story audit';git pull --rebase origin main;git push origin main}
