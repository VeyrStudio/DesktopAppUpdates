            appName='The Index'
            version=$version
            url="https://github.com/VeyrStudio/DesktopAppUpdates/releases/download/the-index-v$version/TheIndexSetup-$version.exe"
            sha256="$env:INDEX_INSTALLER_SHA"
            notes="The Index Windows desktop $version."
            publishedAt=(Get-Date).ToUniversalTime().ToString('yyyy-MM-ddTHH:mm:ssZ')
          }
          $manifest | ConvertTo-Json -Depth 8 | Set-Content 'the-index/latest.json' -Encoding utf8
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'the-index/latest.json'
          git commit -m "Publish The Index update manifest v$version"
          git push
