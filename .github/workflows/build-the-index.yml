name: Build The Index for Windows

on:
  push:
    branches: [main]
    paths:
      - 'apps/the-index/**'
      - '.github/workflows/build-the-index.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: the-index-windows-release
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: apps/the-index
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            apps/the-index
            the-index
          sparse-checkout-cone-mode: false

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Restore original renderer and approved icon artwork
        shell: pwsh
        working-directory: .
        run: |
          $part = 'apps/the-index/.source-parts'
          New-Item -ItemType Directory -Force -Path 'apps/the-index/assets' | Out-Null
          node -e "const fs=require('fs'),zlib=require('zlib');const b=Buffer.from(fs.readFileSync('$part/renderer.br.b64','utf8').trim(),'base64');fs.writeFileSync('apps/the-index/src/renderer.js',zlib.brotliDecompressSync(b));"
          $source = (Get-Content "$part/icon-small.png.b64" -Raw).Trim()
          [IO.File]::WriteAllBytes('apps/the-index/assets/icon.png', [Convert]::FromBase64String($source))
          $rendererHash = (Get-FileHash 'apps/the-index/src/renderer.js' -Algorithm SHA256).Hash.ToLowerInvariant()
          $iconHash = (Get-FileHash 'apps/the-index/assets/icon.png' -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($rendererHash -ne '5f622e44ea6a8217f1bca0d6a80f211dea85c9f7b348ec4d165f83d9e8cc73e6') { throw 'Renderer source SHA256 mismatch' }
          if ($iconHash -ne 'fe83e043999038b7037e6115cfa51a3bf552f93bcf61007944a44e26059827a1') { throw 'Approved icon SHA256 mismatch' }

      - name: Create multi-resolution Windows icon
        shell: pwsh
        run: |
          python -m pip install pillow
          @'
          from PIL import Image
          im = Image.open("assets/icon.png").convert("RGBA").resize((256,256), Image.Resampling.LANCZOS)
          im.save("assets/icon.ico", format="ICO", sizes=[(16,16),(24,24),(32,32),(48,48),(64,64),(128,128),(256,256)])
          '@ | python -
          if (-not (Test-Path 'assets/icon.ico')) { throw 'ICO generation failed' }

      - name: Check JavaScript syntax
        run: |
          node --check src/main.js
          node --check src/renderer.js
          node --check src/preload.js
          node --check src/updater.js
          node --check src/profile-enhancements.js
          node --check src/library-enhancements.js
          node --check src/settings-enhancements.js
          node --check src/quality-enhancements.js
          node --check src/productivity-enhancements.js
          node --check src/profile-layout.js

      - name: Install app dependencies
        run: npm install --no-audit --no-fund

      - name: Run automated tests
        run: npm test

      - name: Assign The Index version
        shell: pwsh
        run: |
          $version = '0.2.${{ github.run_number }}'
          npm version $version --no-git-tag-version --allow-same-version
          if ($LASTEXITCODE -ne 0) { throw 'Version update failed' }
          "INDEX_VERSION=$version" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build Windows NSIS installer
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder --win nsis --publish never

      - name: Check installer and record SHA256
        shell: pwsh
        run: |
          $filename = "dist/TheIndexSetup-$env:INDEX_VERSION.exe"
          if (-not (Test-Path $filename)) { throw "Installer missing: $filename" }
          $sha=(Get-FileHash $filename -Algorithm SHA256).Hash.ToLowerInvariant()
          "INDEX_INSTALLER_SHA=$sha" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "INDEX_INSTALLER_FILE=$filename" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Publish app-specific GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "the-index-v$env:INDEX_VERSION"
          $published = $false
          for ($attempt=1; $attempt -le 3; $attempt++) {
            gh release create $tag $env:INDEX_INSTALLER_FILE --repo 'VeyrStudio/DesktopAppUpdates' --title "The Index $env:INDEX_VERSION" --notes "The Index expanded Windows release: character editors, stories, worldbuilding, notebook, tags, timeline, settings, and updates." --target '${{ github.sha }}'
            if ($LASTEXITCODE -eq 0) { $published=$true; break }
            if ($attempt -lt 3) { Start-Sleep -Seconds 12 }
          }
          if (-not $published) { throw "Release publication failed after 3 attempts" }

      - name: Update dedicated The Index manifest
        shell: pwsh
        working-directory: .
        run: |
          $version = $env:INDEX_VERSION
          $manifest = [ordered]@{
            schemaVersion = 1
            appId = 'the-index'
            appName = 'The Index'
            version = $version
            url = "https://github.com/VeyrStudio/DesktopAppUpdates/releases/download/the-index-v$version/TheIndexSetup-$version.exe"
            sha256 = $env:INDEX_INSTALLER_SHA
            notes = "The Index Windows desktop $version."
            publishedAt = (Get-Date).ToUniversalTime().ToString('yyyy-MM-ddTHH:mm:ssZ')
          }
          $manifest | ConvertTo-Json -Depth 5 | Set-Content 'the-index/latest.json' -Encoding utf8
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'the-index/latest.json'
          git commit -m "Publish The Index manifest v$version"
          if ($LASTEXITCODE -ne 0) { throw "Manifest commit failed" }
          git restore 'apps/the-index/package.json'
          git pull --rebase origin main
          if ($LASTEXITCODE -ne 0) { throw "Rebase failed" }
          git push origin HEAD:main
          if ($LASTEXITCODE -ne 0) { throw "Manifest push failed" }
