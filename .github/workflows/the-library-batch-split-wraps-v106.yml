name: The Library Batch Split Wraps v1.0.6
on:
  push:
    paths:
      - 'tools/the-library-batch-split-wraps-v106.py'
      - '.github/workflows/the-library-batch-split-wraps-v106.yml'
permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build exact v1.0.6 payload
        shell: pwsh
        run: python tools/the-library-batch-split-wraps-v106.py

      - name: Parse updater with Windows PowerShell
        shell: powershell
        run: |
          $tokens=$null;$errors=$null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path '.library-v106-validation/CoverVault.ps1'),[ref]$tokens,[ref]$errors)|Out-Null
          if($errors.Count -gt 0){
            $errors|ForEach-Object{Write-Error (($_.Extent.StartLineNumber.ToString())+': '+$_.Message)}
            throw 'Updater PowerShell parse failed.'
          }

      - name: Patch and parse synthetic current Library
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $root=Join-Path $PWD '.library-v106-runtime'
          $app=Join-Path $root 'App'
          $backup=Join-Path $root 'UpdateBackup'
          New-Item -ItemType Directory -Force -Path $app,$backup|Out-Null

          @'
          Add-Type -AssemblyName System.Windows.Forms
          Add-Type -AssemblyName System.Drawing
          $form=New-Object System.Windows.Forms.Form
          $tabSplit=New-Object System.Windows.Forms.TabPage
          $form.Controls.Add($tabSplit)
          [void]$form.ShowDialog()
          '@ | Set-Content -LiteralPath (Join-Path $backup 'CoverVault.ps1') -Encoding UTF8

          '{"version":"1.0.5"}' | Set-Content -LiteralPath (Join-Path $backup 'AppVersion.json') -Encoding UTF8
          Copy-Item '.library-v106-validation/CoverVault.ps1' (Join-Path $app 'CoverVault.ps1')

          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File (Join-Path $app 'CoverVault.ps1')
          if($LASTEXITCODE -ne 0){throw 'Updater patch returned failure.'}

          $patched=Get-Content -LiteralPath (Join-Path $app 'CoverVault.ps1') -Raw
          foreach($marker in @(
            '# BATCH SPLIT WRAPS v1.0.6',
            'function Open-BatchSplitWraps',
            '$pick.Multiselect = $true',
            'BATCH SPLIT WRAPS',
            'SAVE ALL READY',
            'Back.png',
            'Spine.png',
            'Front.png'
          )){
            if(-not $patched.Contains($marker)){throw "Missing patched marker: $marker"}
          }
          if($patched.ToUpperInvariant().Contains('APPLY TO ALL')){throw 'Apply to All must not exist.'}

          $tokens=$null;$errors=$null
          [System.Management.Automation.Language.Parser]::ParseFile((Join-Path $app 'CoverVault.ps1'),[ref]$tokens,[ref]$errors)|Out-Null
          if($errors.Count -gt 0){
            $errors|ForEach-Object{Write-Error (($_.Extent.StartLineNumber.ToString())+': '+$_.Message)}
            throw 'Patched Library source does not parse.'
          }

          $ver=Get-Content -LiteralPath (Join-Path $app 'AppVersion.json') -Raw|ConvertFrom-Json
          if([string]$ver.version -ne '1.0.6'){throw 'Patched AppVersion is not 1.0.6.'}

      - name: Revalidate payload and hashes
        shell: python
        run: |
          import base64,hashlib,json,pathlib
          root=pathlib.Path('.')
          v=json.loads((root/'the-library/batch-split-wraps-1.0.6-validation.json').read_text())
          b=(root/'the-library'/v['payload']).read_bytes()
          assert hashlib.sha256(b).hexdigest()==v['payloadSha256']
          p=json.loads(b.decode())
          assert p['version']=='1.0.6'
          for f in p['files']:
              d=base64.b64decode(f['contentBase64'])
              assert hashlib.sha256(d).hexdigest()==f['sha256'],f['path']

      - name: Mark validation and commit exact payload
        shell: pwsh
        run: |
          $p='the-library/batch-split-wraps-1.0.6-validation.json'
          $r=Get-Content $p -Raw|ConvertFrom-Json
          $r|Add-Member -NotePropertyName powershellParse -NotePropertyValue 'passed-windows-powershell-parser' -Force
          $r|Add-Member -NotePropertyName syntheticPatchTest -NotePropertyValue 'passed' -Force
          $r|ConvertTo-Json -Depth 10|Set-Content $p -Encoding UTF8
          git config user.name 'VeyrStudio Update Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add 'the-library/payload-1.0.6-batch-split-wraps.txt' 'the-library/batch-split-wraps-1.0.6-validation.json'
          git diff --cached --quiet
          if($LASTEXITCODE -ne 0){
            git commit -m 'Stage validated The Library v1.0.6 batch split wraps'
            git pull --rebase origin main
            git push origin main
          }
