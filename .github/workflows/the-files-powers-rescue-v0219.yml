name: The Files Powers Rescue v0.2.19
on:
  push:
    paths:
      - 'tools/the-files-powers-contrast-rescue-v0219.py'
      - '.github/workflows/the-files-powers-rescue-v0219.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build rescue payload
        shell: pwsh
        run: python tools/the-files-powers-contrast-rescue-v0219.py
      - name: Parse launcher and core under Windows PowerShell
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          foreach($f in @('.powers-rescue-validation/TheFiles.ps1','.powers-rescue-validation/TheFilesCore.ps1')){
            $tokens=$null;$errors=$null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $f),[ref]$tokens,[ref]$errors)|Out-Null
            if($errors.Count -gt 0){$errors|ForEach-Object{Write-Error (($_.Extent.StartLineNumber.ToString())+': '+$_.Message)};throw "PowerShell parse failed: $f"}
          }
          $p='the-files/powers-0.2.19-rescue-validation.json'
          $r=Get-Content $p -Raw|ConvertFrom-Json
          $r|Add-Member -NotePropertyName powershellParse -NotePropertyValue 'passed-windows-powershell-parser' -Force
          $r|ConvertTo-Json -Depth 10|Set-Content $p -Encoding UTF8
      - name: Revalidate package and explicit runnable core
        shell: pwsh
        run: |
          python -c "import json,pathlib,hashlib,base64,gzip; r=pathlib.Path('.'); v=json.loads((r/'the-files/powers-0.2.19-rescue-validation.json').read_text(encoding='utf-8-sig')); b=(r/'the-files'/v['payload']).read_bytes(); assert hashlib.sha256(b).hexdigest()==v['payloadSha256']; x=json.loads(b.decode()); assert x['version']=='0.2.19'; fs={f['path']:f for f in x['files']}; assert 'TheFilesCore.ps1' in fs and 'TheFilesCore.ps1.gz' in fs; [(_ for _ in ()).throw(Exception('internal sha '+p)) if hashlib.sha256(base64.b64decode(f['contentBase64'])).hexdigest()!=f['sha256'] else None for p,f in fs.items()]; raw=base64.b64decode(fs['TheFilesCore.ps1']['contentBase64']); gz=gzip.decompress(base64.b64decode(fs['TheFilesCore.ps1.gz']['contentBase64'])); assert raw==gz; print('Rescue package contains matching runnable + compressed cores')"
      - name: Commit validated payload and report only
        shell: pwsh
        run: |
          git config user.name 'VeyrStudio Update Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add 'the-files/payload-0.2.19-powers-contrast-rescue-part-001.txt' 'the-files/powers-0.2.19-rescue-validation.json'
          git diff --cached --quiet
          if($LASTEXITCODE -ne 0){git commit -m 'Stage validated The Files v0.2.19 Powers rescue';git push}
