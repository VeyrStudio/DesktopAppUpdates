name: Inspect The Files v0.2.21 Renderer
on:
  push:
    paths:
      - '.github/workflows/the-files-inspect-render-v0221.yml'
permissions:
  contents: write
jobs:
  inspect:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Extract renderer
        shell: python
        run: |
          from pathlib import Path
          import json,base64
          r=Path('.'); m=json.loads((r/'the-files/manifest.json').read_text())
          b=b''.join((r/'the-files'/p['url'].rsplit('/',1)[-1]).read_bytes() for p in m['payloadParts']); p=json.loads(b.decode())
          fs={f['path']:f for f in p['files']}; c=base64.b64decode(fs['TheFilesCore.ps1']['contentBase64']).decode('utf-8-sig').splitlines()
          out=[]
          for a,z in [(1650,1910),(1180,1360)]:
              out += [f'{i+1}: {c[i]}' for i in range(a-1,min(z,len(c)))]
          (r/'tools/current-render-v0.2.21.txt').write_text('\n'.join(out),encoding='utf-8')
      - name: Commit inspection
        shell: pwsh
        run: |
          git config user.name 'VeyrStudio Update Bot'; git config user.email 'actions@users.noreply.github.com'
          git add tools/current-render-v0.2.21.txt; git diff --cached --quiet
          if($LASTEXITCODE -ne 0){git commit -m 'Inspect The Files v0.2.21 renderer';git pull --rebase origin main;git push origin main}
