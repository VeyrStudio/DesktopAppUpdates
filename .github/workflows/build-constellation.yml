name: Build Constellation

on:
  push:
    branches: [main]
    paths:
      - "apps/constellation/**"
      - ".github/workflows/build-constellation.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: apps/constellation

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Use stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/constellation/src-tauri -> target

      - name: Install frontend tooling
        run: npm install

      - name: Reconstruct approved Constellation icon
        shell: pwsh
        run: |
          $parts = Get-ChildItem ".icon-parts/*.txt" | Sort-Object Name
          if (-not $parts) { throw "Constellation icon parts are missing." }
          $encoded = ($parts | ForEach-Object { Get-Content $_.FullName -Raw }) -join ""
          New-Item -ItemType Directory -Force -Path "src/assets" | Out-Null
          $source = Join-Path $env:RUNNER_TEMP "constellation-approved-icon.png"
          [IO.File]::WriteAllBytes($source, [Convert]::FromBase64String($encoded))
          Copy-Item $source "src/assets/icon.png" -Force
          npx tauri icon $source
          if (-not (Test-Path "src-tauri/icons/icon.ico")) { throw "Tauri did not generate Constellation icon.ico." }

      - name: Assign automatic Constellation version
        shell: pwsh
        run: |
          $version = "0.1.${{ github.run_number }}"
          $config = Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json
          $config.version = $version
          $config | ConvertTo-Json -Depth 20 | Set-Content src-tauri/tauri.conf.json -Encoding UTF8

          $package = Get-Content package.json -Raw | ConvertFrom-Json
          $package.version = $version
          $package | ConvertTo-Json -Depth 20 | Set-Content package.json -Encoding UTF8

          $cargo = Get-Content src-tauri/Cargo.toml -Raw
          $cargo = $cargo -replace '(?m)^version = "[^"]+"', "version = `"$version`""
          Set-Content src-tauri/Cargo.toml $cargo -Encoding UTF8
          "CONSTELLATION_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Validate Constellation source
        shell: pwsh
        run: |
          node --check src/app.js
          node --check src/seed.js
          Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json | Out-Null
          if (-not (Test-Path "src/assets/icon.png")) { throw "App icon missing." }
          if (-not (Select-String -Path "src-tauri/src/main.rs" -SimpleMatch '#![cfg_attr(not(debug_assertions), windows_subsystem = "windows")]' -Quiet)) { throw "Release build would open a console window." }

      - name: Build Windows installer
        run: npm run build -- --bundles nsis

      - name: Prepare release asset and updater manifest
        id: release_info
        shell: pwsh
        run: |
          $version = $env:CONSTELLATION_VERSION
          $tag = "constellation-v$version"
          $source = Get-ChildItem "src-tauri/target/release/bundle/nsis/*-setup.exe" | Select-Object -First 1
          if (-not $source) { throw "Constellation NSIS installer was not created." }
          $assetName = "ConstellationSetup-$version.exe"
          $assetPath = Join-Path $env:RUNNER_TEMP $assetName
          Copy-Item $source.FullName $assetPath -Force
          $sha256 = (Get-FileHash $assetPath -Algorithm SHA256).Hash.ToLowerInvariant()
          $downloadUrl = "https://github.com/${{ github.repository }}/releases/download/$tag/$assetName"
          $publishedAt = (Get-Date).ToUniversalTime().ToString("o")
          $shortSha = "${{ github.sha }}".Substring(0,7)
          $manifest = [ordered]@{ version=$version; url=$downloadUrl; sha256=$sha256; notes="Constellation desktop update ($shortSha)."; publishedAt=$publishedAt }
          $manifest | ConvertTo-Json | Set-Content (Join-Path $env:RUNNER_TEMP "latest.json") -Encoding UTF8
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "asset_path=$assetPath" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Upload Windows build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Constellation-Windows-${{ env.CONSTELLATION_VERSION }}
          path: |
            ${{ steps.release_info.outputs.asset_path }}
            ${{ runner.temp }}/latest.json

      - name: Publish Constellation release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ steps.release_info.outputs.tag }}"
          $asset = "${{ steps.release_info.outputs.asset_path }}"
          if (gh release view $tag --repo "${{ github.repository }}" 2>$null) { gh release upload $tag $asset --clobber --repo "${{ github.repository }}" }
          else { gh release create $tag $asset --repo "${{ github.repository }}" --title "Constellation $env:CONSTELLATION_VERSION" --notes "Automatic Constellation Windows desktop build." }

      - name: Refresh Constellation live update channel
        shell: pwsh
        working-directory: .
        run: |
          New-Item -ItemType Directory -Force -Path "constellation" | Out-Null
          Copy-Item (Join-Path $env:RUNNER_TEMP "latest.json") "constellation/latest.json" -Force
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add constellation/latest.json
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m "Constellation updater: $env:CONSTELLATION_VERSION [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          }
