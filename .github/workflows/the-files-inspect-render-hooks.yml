name: Inspect The Files Render Hooks
on:
  push:
    paths:
      - '.github/workflows/the-files-inspect-render-hooks.yml'
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Capture relevant render hooks
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('tools/current-core-v0.2.16.ps1')
          lines=p.read_text(encoding='utf-8-sig').splitlines()
          needles=('RelationshipJson','FamilyJson','Render-CurrentCharacter','Randomize-Field','Add-Field','FieldDefs.Keys')
          hits=[]
          seen=set()
          for i,line in enumerate(lines):
              if any(n in line for n in needles):
                  for j in range(max(0,i-12),min(len(lines),i+22)):
                      if j not in seen:
                          hits.append(f'{j+1:05d}: {lines[j]}');seen.add(j)
                  hits.append('-----')
          Path('tools/current-core-v0.2.16-render-hooks.txt').write_text('\n'.join(hits),encoding='utf-8')
          PY
      - name: Commit inspection
        run: |
          git config user.name 'VeyrStudio Update Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add tools/current-core-v0.2.16-render-hooks.txt
          git diff --cached --quiet || (git commit -m 'Capture The Files v0.2.16 render hooks for Powers rebuild' && git push)
