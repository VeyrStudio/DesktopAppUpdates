name: Build and publish Resume for Windows
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'apps/resume/**'
      - '.github/workflows/resume-windows.yml'
  push:
    branches: [resume-photo-app]
    paths:
      - 'apps/resume/**'
      - '.github/workflows/resume-windows.yml'
concurrency:
  group: resume-release
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: apps/resume
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Test source
        run: npm test
      - name: Prepare approved Resume icon
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Drawing
          $sourceBytes = [Convert]::FromBase64String((Get-Content 'build/icon.base64' -Raw).Trim())
          $inputStream = [IO.MemoryStream]::new([byte[]]$sourceBytes)
          $source = [Drawing.Image]::FromStream($inputStream)
          $bitmap = [Drawing.Bitmap]::new(256, 256)
          $graphics = [Drawing.Graphics]::FromImage($bitmap)
          $graphics.InterpolationMode = [Drawing.Drawing2D.InterpolationMode]::HighQualityBicubic
          $graphics.DrawImage($source, 0, 0, 256, 256)
          # Preserve bright gold strokes, recolor dark burgundy fields without darkening the symbol.
          for ($y=0; $y -lt 256; $y++) {
            for ($x=0; $x -lt 256; $x++) {
              $c=$bitmap.GetPixel($x,$y)
              if ($c.A -eq 0) { continue }
              $gold = ($c.R -gt 100 -and $c.G -gt 73 -and $c.B -lt ($c.G * 0.89) -and $c.R -lt ($c.G * 2.05))
              if (-not $gold) {
                $light=[Math]::Max(0.15,[Math]::Min(1.0,(($c.R+$c.G+$c.B)/3.0)/130.0))
                $rr=[int](9 + 20*$light)
                $gg=[int](26 + 67*$light)
                $bb=[int](20 + 41*$light)
                $bitmap.SetPixel($x,$y,[Drawing.Color]::FromArgb($c.A,$rr,$gg,$bb))
              }
            }
          }
          $outputStream = [IO.MemoryStream]::new()
          $bitmap.Save($outputStream, [Drawing.Imaging.ImageFormat]::Png)
          $raw = $outputStream.ToArray()
          [IO.File]::WriteAllBytes('build/icon.png', $raw)
          $ico = [IO.MemoryStream]::new()
          $writer = [IO.BinaryWriter]::new($ico)
          $writer.Write([uint16]0); $writer.Write([uint16]1); $writer.Write([uint16]1)
          $writer.Write([byte]0); $writer.Write([byte]0); $writer.Write([byte]0); $writer.Write([byte]0)
          $writer.Write([uint16]1); $writer.Write([uint16]32); $writer.Write([uint32]$raw.Length); $writer.Write([uint32]22)
          $writer.Write($raw); $writer.Flush()
          [IO.File]::WriteAllBytes('build/icon.ico', $ico.ToArray())
          $writer.Dispose(); $ico.Dispose(); $graphics.Dispose(); $bitmap.Dispose(); $source.Dispose(); $inputStream.Dispose(); $outputStream.Dispose()
      - name: Build Windows installer
        run: npm run build:win
      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: Resume-Windows-Installer
          path: apps/resume/dist/ResumeSetup-*.exe
          if-no-files-found: error
      - name: Publish direct-download Resume test installer
        if: github.event_name != 'pull_request'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $version = (Get-Content 'package.json' | ConvertFrom-Json).version
          $tag = "resume-test-v$version"
          $installer = (Get-ChildItem 'dist/ResumeSetup-*.exe' | Select-Object -First 1).FullName
          if (!(Test-Path $installer)) { throw 'Resume installer was not generated' }
          gh release view $tag 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $installer --clobber
          } else {
            gh release create $tag $installer --target $env:GITHUB_SHA --title "Resume $version - Test Installer" --notes "Pre-release test build of the independent Resume Windows photo archive. Review the app before copying your Replay photos." --prerelease
          }
          if ($LASTEXITCODE -ne 0) { throw 'Unable to publish Resume test installer' }
