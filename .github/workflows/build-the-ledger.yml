name: Build The Ledger for Windows

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "ledger-v*"
    paths:
      - "apps/the-ledger/**"
      - ".github/workflows/build-the-ledger.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - name: Check out The Ledger
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install app dependencies
        run: npm install
        working-directory: apps/the-ledger

      - name: Restore approved app icon
        shell: pwsh
        working-directory: apps/the-ledger
        run: |
          $encoded = (Get-ChildItem build/icon-parts/*.txt | Sort-Object Name | ForEach-Object { Get-Content $_.FullName -Raw }) -join ""
          [IO.File]::WriteAllBytes("build/icon.png", [Convert]::FromBase64String($encoded))

      - name: Build pinned whisper.cpp engine
        shell: pwsh
        working-directory: apps/the-ledger
        run: |
          git clone --depth 1 --branch b4938 https://github.com/ggml-org/whisper.cpp vendor/whisper.cpp
          cmake -S vendor/whisper.cpp -B vendor/whisper.cpp/build -G "Visual Studio 17 2022" -A x64 -DWHISPER_BUILD_TESTS=OFF -DWHISPER_BUILD_EXAMPLES=ON -DBUILD_SHARED_LIBS=OFF -DGGML_NATIVE=OFF
          cmake --build vendor/whisper.cpp/build --config Release --target whisper-cli
          New-Item -ItemType Directory -Force resources/bin | Out-Null
          Copy-Item vendor/whisper.cpp/build/bin/Release/* resources/bin/ -Force

      - name: Bundle FFmpeg and balanced model
        shell: pwsh
        working-directory: apps/the-ledger
        run: |
          choco install ffmpeg -y --no-progress
          $ffmpeg = Get-ChildItem "$env:ChocolateyInstall\lib\ffmpeg\tools" -Filter ffmpeg.exe -Recurse | Select-Object -First 1
          if (-not $ffmpeg) { throw "Chocolatey installed FFmpeg, but its executable could not be found." }
          Copy-Item $ffmpeg.FullName resources/bin/ffmpeg.exe -Force
          Invoke-WebRequest -Uri "https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-small.en-q5_1.bin" -OutFile "resources/models/ggml-small.en-q5_1.bin"

      - name: Test The Ledger
        run: npm test
        working-directory: apps/the-ledger

      - name: Build installer
        run: npm run build:win
        working-directory: apps/the-ledger

      - name: Read app version
        id: app
        shell: pwsh
        working-directory: apps/the-ledger
        run: |
          $version = node -p "require('./package.json').version"
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Create verified update manifest
        shell: pwsh
        working-directory: apps/the-ledger
        run: |
          $installer = Get-ChildItem dist/TheLedgerSetup-*.exe | Select-Object -First 1
          node scripts/build-manifest.mjs $installer.FullName

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: TheLedger-Windows
          path: |
            apps/the-ledger/dist/TheLedgerSetup-*.exe
            apps/the-ledger/dist/ledger.json

      - name: Publish installer release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ledger-v${{ steps.app.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: The Ledger ${{ steps.app.outputs.version }}
          files: |
            apps/the-ledger/dist/TheLedgerSetup-*.exe
            apps/the-ledger/dist/ledger.json
          generate_release_notes: true

      - name: Publish The Ledger update channel
        shell: pwsh
        working-directory: .
        run: |
          New-Item -ItemType Directory -Force the-ledger | Out-Null
          Copy-Item apps/the-ledger/dist/ledger.json the-ledger/ledger.json -Force
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add the-ledger/ledger.json
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) { exit 0 }
          git commit -m "Update The Ledger channel to ${{ steps.app.outputs.version }}"
          git push
