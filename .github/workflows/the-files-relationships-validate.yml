name: The Files Relationships Validate
on:
  push:
    paths:
      - 'scripts/validate_relationships_0216.py'
      - '.github/workflows/the-files-relationships-validate.yml'
      - 'the-files/payload-0.2.16-relationships-rebuild-part-001.txt'
  pull_request:
    branches: [main]
permissions:
  contents: write
jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate package and audit requirements
        shell: pwsh
        run: python scripts/validate_relationships_0216.py
      - name: Parse PowerShell scripts
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $files=@('.relationship-validation/TheFiles.ps1','.relationship-validation/TheFilesCore.ps1')
          foreach($f in $files){
            $tokens=$null; $errors=$null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $f),[ref]$tokens,[ref]$errors) | Out-Null
            if($errors.Count -gt 0){ $errors | ForEach-Object { Write-Error $_.Message }; throw "PowerShell parse failed for $f" }
          }
          $r=Get-Content 'the-files/relationships-0.2.16-validation.json' -Raw | ConvertFrom-Json
          $r.powershellParse='passed-windows-powershell-parser'
          $r | ConvertTo-Json -Depth 10 | Set-Content 'the-files/relationships-0.2.16-validation.json' -Encoding UTF8
      - name: Commit validated safe payloads on validation branch
        if: github.event_name == 'pull_request' && github.head_ref == 'validate-the-files-0216-relationships'
        shell: pwsh
        run: |
          git config user.name 'VeyrStudio Validation'
          git config user.email 'actions@users.noreply.github.com'
          git add 'the-files/payload-0.2.16-relationships-safe-part-*.txt' 'the-files/relationships-0.2.16-validation.json'
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) { git commit -m 'Stage validated safe The Files v0.2.16 Relationships payload'; git push origin HEAD:${{ github.head_ref }} }
