name: Build and publish Replay for Windows
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'apps/replay/**'
      - '.github/workflows/replay-windows.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: apps/replay
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Test source
        run: npm test
      - name: Prepare approved Replay icon
        shell: pwsh
        run: |
          $raw = [Convert]::FromBase64String((Get-Content 'build/icon.base64' -Raw).Trim())
          New-Item -ItemType Directory -Force -Path 'build' | Out-Null
          [IO.File]::WriteAllBytes('build/icon.png', $raw)
          $ico = New-Object IO.MemoryStream
          $writer = New-Object IO.BinaryWriter($ico)
          $writer.Write([uint16]0); $writer.Write([uint16]1); $writer.Write([uint16]1)
          $writer.Write([byte]48); $writer.Write([byte]48); $writer.Write([byte]0); $writer.Write([byte]0)
          $writer.Write([uint16]1); $writer.Write([uint16]32); $writer.Write([uint32]$raw.Length); $writer.Write([uint32]22)
          $writer.Write($raw); $writer.Flush()
          [IO.File]::WriteAllBytes('build/icon.ico', $ico.ToArray())
          $writer.Dispose(); $ico.Dispose()
      - name: Build Windows installer
        run: npm run build:win
      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: Replay-Windows-Installer
          path: apps/replay/dist/ReplaySetup-*.exe
          if-no-files-found: error
      - name: Publish versioned installer and update manifest
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $version = (Get-Content 'package.json' | ConvertFrom-Json).version
          $installer = (Get-ChildItem 'dist/ReplaySetup-*.exe' | Select-Object -First 1).FullName
          $tag = "replay-v$version"
          $filename = Split-Path $installer -Leaf
          gh release view $tag 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $installer --clobber
          } else {
            gh release create $tag $installer --title "Replay $version" --notes "Replay Windows installer"
          }
          if ($LASTEXITCODE -ne 0) { throw 'Could not publish Replay installer' }
          $sha = (Get-FileHash -Algorithm SHA256 $installer).Hash.ToLowerInvariant()
          $manifest = @{ version = $version; url = "https://github.com/$env:GITHUB_REPOSITORY/releases/download/$tag/$filename"; sha256 = $sha } | ConvertTo-Json
          New-Item -ItemType Directory -Force -Path '../../replay' | Out-Null
          Set-Content -Path '../../replay/replay.json' -Value $manifest -Encoding UTF8
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ../../replay/replay.json
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m "Publish Replay update manifest $version"
            git push origin HEAD:main
          }
