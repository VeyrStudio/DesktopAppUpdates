name: Inspect The Files v0.2.24 Notes
on:
  push:
    paths:
      - '.github/workflows/the-files-inspect-notes-v0224.yml'
permissions:
  contents: write
jobs:
  inspect:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Extract Notes definitions
        shell: python
        run: |
          from pathlib import Path
          import json,base64
          r=Path('.'); m=json.loads((r/'the-files/manifest.json').read_text())
          b=b''.join((r/'the-files'/p['url'].rsplit('/',1)[-1]).read_bytes() for p in m['payloadParts'])
          p=json.loads(b.decode()); fs={f['path']:f for f in p['files']}
          c=base64.b64decode(fs['TheFilesCore.ps1']['contentBase64']).decode('utf-8-sig').splitlines()
          out=[]
          for i,line in enumerate(c):
              if "'Notes' = @(" in line or any(k in line for k in ["Aliases","Tags","Mood Board","Aesthetic","Color Palette","Important Objects","Former Names","Quotes","Playlist","Inspirations","Voice Reference","What This Character Knows","What the Reader Knows","Source-Specific Notes","Universe-Wide Notes","Trivia","Custom Fields","Anything Else","Private Author Notes"]):
                  out.append(f'{i+1}: {line}')
          (r/'tools/current-notes-v0.2.24.txt').write_text('\n'.join(out),encoding='utf-8')
      - name: Commit inspection
        shell: pwsh
        run: |
          git config user.name 'VeyrStudio Update Bot'; git config user.email 'actions@users.noreply.github.com'
          git add tools/current-notes-v0.2.24.txt; git diff --cached --quiet
          if($LASTEXITCODE -ne 0){git commit -m 'Inspect The Files v0.2.24 Notes';git pull --rebase origin main;git push origin main}
