name: Temporary Library Source Bundle
on:
  push:
    paths:
      - '.github/workflows/tmp-library-source-bundle.yml'
permissions:
  contents: read

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Collect Library update sources
        shell: bash
        run: |
          mkdir -p bundle/the-library bundle/tools
          cp the-library/payload-*.txt bundle/the-library/
          cp tools/the-library-*.py bundle/tools/
      - uses: actions/upload-artifact@v4
        with:
          name: library-update-sources
          path: bundle
          if-no-files-found: error
          retention-days: 1
