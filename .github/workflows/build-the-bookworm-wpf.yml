name: Build The Bookworm WPF

on:
  workflow_dispatch:
  push:
    paths:
      - "apps/the-bookworm/source-parts/**"
      - "apps/the-bookworm/icon-base64.txt"
      - ".github/workflows/build-the-bookworm-wpf.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Reassemble and expand Bookworm source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $srcRoot = Join-Path $env:RUNNER_TEMP 'bookworm-src'
          if (Test-Path $srcRoot) { Remove-Item $srcRoot -Recurse -Force }
          New-Item -ItemType Directory -Path $srcRoot -Force | Out-Null

          $parts = Get-ChildItem 'apps/the-bookworm/source-parts' -Filter 'part-*.txt' | Sort-Object Name
          if ($parts.Count -ne 8) { throw "Expected 8 Bookworm source parts, found $($parts.Count)." }

          $base64 = ($parts | ForEach-Object { Get-Content $_.FullName -Raw }) -join ''
          $zip = Join-Path $env:RUNNER_TEMP 'TheBookworm-source.zip'
          [IO.File]::WriteAllBytes($zip, [Convert]::FromBase64String($base64))

          $zipHash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($zipHash -ne '790b2d72beea43e602ffe4209a4961d157f5523e1ec201a78ed5b921ac744a87') {
            throw "Bookworm source archive hash mismatch: $zipHash"
          }

          tar -tf $zip | Select-Object -First 5
          tar -xf $zip -C $srcRoot
          if ($LASTEXITCODE -ne 0) { throw "tar failed to extract The Bookworm source (exit $LASTEXITCODE)." }

          $source = Join-Path $srcRoot 'TheBookworm'
          $project = Join-Path $source 'TheBookworm.csproj'
          if (-not (Test-Path $project)) { throw 'The Bookworm project was not found after extraction.' }

          # Install the official Bookworm icon supplied for the app.
          $iconBase64 = (Get-Content 'apps/the-bookworm/icon-base64.txt' -Raw).Trim()
          $iconPath = Join-Path $source 'Assets\TheBookworm.ico'
          [IO.File]::WriteAllBytes($iconPath, [Convert]::FromBase64String($iconBase64))
          $iconHash = (Get-FileHash $iconPath -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($iconHash -ne '5c0cf0f69289dd433645374ab864b4b3eb3c670196b532f90d0460bdc41908c2') {
            throw "Bookworm icon hash mismatch: $iconHash"
          }

          # This icon build is version 0.1.1.
          $projectText = Get-Content $project -Raw
          $projectText = $projectText.Replace('<Version>0.1.0</Version>', '<Version>0.1.1</Version>')
          $projectText = $projectText.Replace('<AssemblyVersion>0.1.0.0</AssemblyVersion>', '<AssemblyVersion>0.1.1.0</AssemblyVersion>')
          $projectText = $projectText.Replace('<FileVersion>0.1.0.0</FileVersion>', '<FileVersion>0.1.1.0</FileVersion>')
          $projectText = $projectText.Replace('<ApplicationIcon></ApplicationIcon>', '<ApplicationIcon>Assets\TheBookworm.ico</ApplicationIcon>')
          $projectText = $projectText.Replace('<Resource Include="Assets\bookworm-placeholder.jpg" />', '<Resource Include="Assets\bookworm-placeholder.jpg" />' + "`r`n    " + '<Resource Include="Assets\TheBookworm.ico" />')
          Set-Content -Path $project -Value $projectText -Encoding utf8

          # Use the same icon on every Bookworm window.
          $mainXaml = Join-Path $source 'MainWindow.xaml'
          $mainText = Get-Content $mainXaml -Raw
          $mainText = $mainText.Replace('WindowStartupLocation="CenterScreen">', 'WindowStartupLocation="CenterScreen" Icon="/Assets/TheBookworm.ico">')
          Set-Content -Path $mainXaml -Value $mainText -Encoding utf8

          $workspaceXaml = Join-Path $source 'BookWorkspaceWindow.xaml'
          $workspaceText = Get-Content $workspaceXaml -Raw
          $workspaceText = $workspaceText.Replace('WindowStartupLocation="CenterOwner">', 'WindowStartupLocation="CenterOwner" Icon="/Assets/TheBookworm.ico">')
          Set-Content -Path $workspaceXaml -Value $workspaceText -Encoding utf8

          foreach ($dialogName in @('SettingsWindow.xaml', 'AddBookDialog.xaml')) {
            $dialogPath = Join-Path $source $dialogName
            $dialogText = Get-Content $dialogPath -Raw
            $dialogText = $dialogText.Replace('ShowInTaskbar="False">', 'ShowInTaskbar="False" Icon="/Assets/TheBookworm.ico">')
            Set-Content -Path $dialogPath -Value $dialogText -Encoding utf8
          }

          # PdfPig changed its NuGet package ID. Keep the app source compatible with the current stable package.
          $projectText = Get-Content $project -Raw
          $projectText = $projectText.Replace('<PackageReference Include="UglyToad.PdfPig" Version="0.1.9" />', '<PackageReference Include="PdfPig" Version="0.1.16" />')
          Set-Content -Path $project -Value $projectText -Encoding utf8

          # WPF does not support these UWP-style/attached XAML properties.
          $mainXaml = Join-Path $source 'MainWindow.xaml'
          $mainText = Get-Content $mainXaml -Raw
          $mainText = $mainText.Replace(' CharacterSpacing="80"', '')
          Set-Content -Path $mainXaml -Value $mainText -Encoding utf8

          $workspaceXaml = Join-Path $source 'BookWorkspaceWindow.xaml'
          $workspaceText = Get-Content $workspaceXaml -Raw
          $workspaceText = $workspaceText.Replace(' TextBlock.TextWrapping="Wrap"', '')
          Set-Content -Path $workspaceXaml -Value $workspaceText -Encoding utf8

          $updateService = Join-Path $source 'Services/UpdateService.cs'
          $updateText = Get-Content $updateService -Raw
          if ($updateText -notmatch 'using System.Net.Http;') {
            $updateText = $updateText.Replace('using System.Diagnostics;', "using System.Diagnostics;`r`nusing System.Net.Http;")
          }
          Set-Content -Path $updateService -Value $updateText -Encoding utf8

          Set-Content -Path (Join-Path $source 'GlobalUsings.cs') -Value "global using System.IO;`r`nglobal using System.Net.Http;" -Encoding utf8

          $studyGenerator = Join-Path $source 'Services/StudyGenerator.cs'
          $studyText = Get-Content $studyGenerator -Raw
          $studyText = $studyText.Replace('var prompt = i % 3 switch', 'var prompt = (i % 3) switch')
          Set-Content -Path $studyGenerator -Value $studyText -Encoding utf8

          "BOOKWORM_SOURCE=$source" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build app and verified update payload
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & (Join-Path $env:BOOKWORM_SOURCE 'build-release.ps1')
          $exe = Join-Path $env:BOOKWORM_SOURCE 'release/publish/TheBookworm.exe'
          if (-not (Test-Path $exe)) { throw 'TheBookworm.exe was not produced.' }
          Get-FileHash $exe -Algorithm SHA256
          New-Item -ItemType Directory -Path 'bookworm-artifact' -Force | Out-Null
          Copy-Item $exe 'bookworm-artifact/TheBookworm.exe' -Force

      - name: Publish automatic-update channel
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $channel = Join-Path $PWD 'the-bookworm'
          New-Item -ItemType Directory -Path $channel -Force | Out-Null
          Get-ChildItem $channel -Filter 'payload-*.txt' -ErrorAction SilentlyContinue | Remove-Item -Force
          $updateDir = Join-Path $env:BOOKWORM_SOURCE 'release/the-bookworm-update'
          Copy-Item (Join-Path $updateDir '*') $channel -Force
          $manifest = Get-Content (Join-Path $channel 'manifest.json') -Raw | ConvertFrom-Json
          "BOOKWORM_VERSION=$($manifest.version)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Commit update feed
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git config user.name "VeyrStudio Update Builder"
          git config user.email "actions@users.noreply.github.com"
          git add the-bookworm
          if (git diff --cached --quiet) {
            Write-Host 'Update channel already matches this build.'
            exit 0
          }
          git commit -m "Release The Bookworm $env:BOOKWORM_VERSION"
          git pull --rebase origin main
          git push origin HEAD:main

      - uses: actions/upload-artifact@v4
        with:
          name: TheBookworm-win-x64-${{ env.BOOKWORM_VERSION }}
          path: bookworm-artifact/TheBookworm.exe
          if-no-files-found: error
