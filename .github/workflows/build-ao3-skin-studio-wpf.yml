name: Build AO3 Skin Studio WPF

on:
  workflow_dispatch:
  push:
    paths:
      - "apps/ao3-skin-studio/source-chunks/**"
      - "apps/ao3-skin-studio/patches/**"
      - ".github/workflows/build-ao3-skin-studio-wpf.yml"

permissions:
  contents: write

concurrency:
  group: ao3-skin-studio-update
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Extract AO3 Skin Studio source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $srcRoot = Join-Path $env:RUNNER_TEMP 'ao3-skin-studio-src'
          if (Test-Path $srcRoot) { Remove-Item $srcRoot -Recurse -Force }
          New-Item -ItemType Directory -Path $srcRoot -Force | Out-Null

          $parts = Get-ChildItem 'apps/ao3-skin-studio/source-chunks' -Filter 'chunk-*.txt' | Sort-Object Name
          if ($parts.Count -ne 20) { throw "Expected 20 AO3 source chunks, found $($parts.Count)." }

          $base64 = ($parts | ForEach-Object { Get-Content $_.FullName -Raw }) -join ''
          $zip = Join-Path $env:RUNNER_TEMP 'AO3SkinStudio-source.zip'
          [IO.File]::WriteAllBytes($zip, [Convert]::FromBase64String($base64))

          $zipHash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($zipHash -ne '7e1fd0a90c0cc1d916af425dca3b6a8e8ec6694b2846f0f4474398aee7e7cabb') {
            throw "AO3 Skin Studio source archive hash mismatch: $zipHash"
          }

          Expand-Archive -Path $zip -DestinationPath $srcRoot -Force
          $project = Join-Path $srcRoot 'AO3SkinStudio/AO3SkinStudio.csproj'
          if (-not (Test-Path $project)) { throw 'AO3 Skin Studio project was not found after extraction.' }

          # Apply the 0.1.1 embedded Studio update.
          $htmlParts = Get-ChildItem 'apps/ao3-skin-studio/patches/0.1.1/html' -Filter 'chunk-*.txt' | Sort-Object Name
          if ($htmlParts.Count -ne 9) { throw "Expected 9 AO3 0.1.1 HTML chunks, found $($htmlParts.Count)." }

          $htmlBase64 = ($htmlParts | ForEach-Object { Get-Content $_.FullName -Raw }) -join ''
          $gzipBytes = [Convert]::FromBase64String($htmlBase64)
          $inputStream = [IO.MemoryStream]::new($gzipBytes)
          $gzipStream = [IO.Compression.GZipStream]::new($inputStream, [IO.Compression.CompressionMode]::Decompress)
          $outputStream = [IO.MemoryStream]::new()
          $gzipStream.CopyTo($outputStream)
          $gzipStream.Dispose()
          $inputStream.Dispose()
          $htmlBytes = $outputStream.ToArray()
          $outputStream.Dispose()

          $studioHtml = Join-Path $srcRoot 'AO3SkinStudio/Web/ao3-skin-studio.html'
          [IO.File]::WriteAllBytes($studioHtml, $htmlBytes)
          $htmlHash = (Get-FileHash $studioHtml -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($htmlHash -ne '33fce7b5aa726aa4f206dfd83f968c2132b688d81e865b664d75edce0f8da2b7') {
            throw "AO3 Skin Studio 0.1.1 HTML hash mismatch: $htmlHash"
          }

          # 0.1.2: add elegant system-font stacks without relying on remote font files.
          $studioText = Get-Content $studioHtml -Raw
          $fontAnchor = '              <option value="Georgia, serif">Georgia</option>'
          $fontInsert = @(
            '              <option value="Georgia, serif">Georgia</option>'
            '              <option value="&quot;Palatino Linotype&quot;, &quot;Book Antiqua&quot;, Palatino, Georgia, serif">Elegant Serif — Palatino</option>'
            '              <option value="Garamond, &quot;EB Garamond&quot;, Georgia, serif">Elegant Serif — Garamond</option>'
            '              <option value="Baskerville, &quot;Baskerville Old Face&quot;, &quot;Hoefler Text&quot;, Garamond, Georgia, serif">Elegant Serif — Baskerville</option>'
          ) -join "`r`n"
          if (-not $studioText.Contains($fontAnchor)) { throw 'Font insertion anchor was not found.' }
          $studioText = $studioText.Replace($fontAnchor, $fontInsert.TrimEnd())
          [IO.File]::WriteAllText($studioHtml, $studioText, [Text.UTF8Encoding]::new($false))

          # 0.1.3: responsive desktop/tablet/mobile preview and exported mobile safeguards.
          $responsivePatchPath = 'apps/ao3-skin-studio/patches/0.1.3/responsive-injection.html'
          if (-not (Test-Path $responsivePatchPath)) { throw 'AO3 Skin Studio 0.1.3 responsive patch was not found.' }
          $responsivePatch = Get-Content $responsivePatchPath -Raw
          $studioText = Get-Content $studioHtml -Raw
          if (-not $studioText.Contains('</body>')) { throw 'AO3 Skin Studio body closing tag was not found.' }
          $studioText = $studioText.Replace('</body>', $responsivePatch + "`r`n</body>")
          [IO.File]::WriteAllText($studioHtml, $studioText, [Text.UTF8Encoding]::new($false))

          # 0.1.4: group page/header/footer background controls together and give footer its own background.
          $backgroundGroupingPatchPath = 'apps/ao3-skin-studio/patches/0.1.4/background-grouping-injection.html'
          if (-not (Test-Path $backgroundGroupingPatchPath)) { throw 'AO3 Skin Studio 0.1.4 background grouping patch was not found.' }
          $backgroundGroupingPatch = Get-Content $backgroundGroupingPatchPath -Raw
          $studioText = Get-Content $studioHtml -Raw
          if (-not $studioText.Contains('</body>')) { throw 'AO3 Skin Studio body closing tag was not found for 0.1.4.' }
          $studioText = $studioText.Replace('</body>', $backgroundGroupingPatch + "`r`n</body>")
          [IO.File]::WriteAllText($studioHtml, $studioText, [Text.UTF8Encoding]::new($false))

          # 0.1.5: add scrollable Results/Browse and Inside-a-Fic preview modes.
          $previewPagesPatchPath = 'apps/ao3-skin-studio/patches/0.1.5/preview-pages-injection.html'
          if (-not (Test-Path $previewPagesPatchPath)) { throw 'AO3 Skin Studio 0.1.5 preview pages patch was not found.' }
          $previewPagesPatch = Get-Content $previewPagesPatchPath -Raw
          $studioText = Get-Content $studioHtml -Raw
          if (-not $studioText.Contains('</body>')) { throw 'AO3 Skin Studio body closing tag was not found for 0.1.5.' }
          $studioText = $studioText.Replace('</body>', $previewPagesPatch + "`r`n</body>")
          [IO.File]::WriteAllText($studioHtml, $studioText, [Text.UTF8Encoding]::new($false))

          # 0.1.6: add side-by-side Results/Fic split preview.
          $splitPreviewPatchPath = 'apps/ao3-skin-studio/patches/0.1.6/split-preview-injection.html'
          if (-not (Test-Path $splitPreviewPatchPath)) { throw 'AO3 Skin Studio 0.1.6 split preview patch was not found.' }
          $splitPreviewPatch = Get-Content $splitPreviewPatchPath -Raw
          $studioText = Get-Content $studioHtml -Raw
          if (-not $studioText.Contains('</body>')) { throw 'AO3 Skin Studio body closing tag was not found for 0.1.6.' }
          $studioText = $studioText.Replace('</body>', $splitPreviewPatch + "`r`n</body>")
          [IO.File]::WriteAllText($studioHtml, $studioText, [Text.UTF8Encoding]::new($false))

          # 0.1.7: one continuous background + editable required tag/warning boxes.
          $requiredTagsPatchPath = 'apps/ao3-skin-studio/patches/0.1.7/unified-background-required-tags.html'
          if (-not (Test-Path $requiredTagsPatchPath)) { throw 'AO3 Skin Studio 0.1.7 required-tags patch was not found.' }
          $requiredTagsPatch = Get-Content $requiredTagsPatchPath -Raw
          $studioText = Get-Content $studioHtml -Raw
          if (-not $studioText.Contains('</body>')) { throw 'AO3 Skin Studio body closing tag was not found for 0.1.7.' }
          $studioText = $studioText.Replace('</body>', $requiredTagsPatch + "`r`n</body>")
          [IO.File]::WriteAllText($studioHtml, $studioText, [Text.UTF8Encoding]::new($false))

          # 0.1.8: animated GIF support + compact required-tags block.
          $gifGridPatchPath = 'apps/ao3-skin-studio/patches/0.1.8/gif-and-correct-required-grid.html'
          if (-not (Test-Path $gifGridPatchPath)) { throw 'AO3 Skin Studio 0.1.8 GIF/grid patch was not found.' }
          $gifGridPatch = Get-Content $gifGridPatchPath -Raw
          $studioText = Get-Content $studioHtml -Raw
          if (-not $studioText.Contains('</body>')) { throw 'AO3 Skin Studio body closing tag was not found for 0.1.8.' }
          $studioText = $studioText.Replace('</body>', $gifGridPatch + "`r`n</body>")
          [IO.File]::WriteAllText($studioHtml, $studioText, [Text.UTF8Encoding]::new($false))

          # 0.1.9: include the navigation band in the unified background and match AO3 required-tag icon language.
          $exactIconsPatchPath = 'apps/ao3-skin-studio/patches/0.1.9/exact-ao3-icons-and-unified-nav.html'
          if (-not (Test-Path $exactIconsPatchPath)) { throw 'AO3 Skin Studio 0.1.9 exact-icons patch was not found.' }
          $exactIconsPatch = Get-Content $exactIconsPatchPath -Raw
          $studioText = Get-Content $studioHtml -Raw
          if (-not $studioText.Contains('</body>')) { throw 'AO3 Skin Studio body closing tag was not found for 0.1.9.' }
          $studioText = $studioText.Replace('</body>', $exactIconsPatch + "`r`n</body>")
          [IO.File]::WriteAllText($studioHtml, $studioText, [Text.UTF8Encoding]::new($false))

          # 0.1.10: turn the basic gradient controls into an advanced Gradient Studio.
          $gradientStudioPatchPath = 'apps/ao3-skin-studio/patches/0.1.10/advanced-gradient-studio.html'
          if (-not (Test-Path $gradientStudioPatchPath)) { throw 'AO3 Skin Studio 0.1.10 Gradient Studio patch was not found.' }
          $gradientStudioPatch = Get-Content $gradientStudioPatchPath -Raw
          $studioText = Get-Content $studioHtml -Raw
          if (-not $studioText.Contains('</body>')) { throw 'AO3 Skin Studio body closing tag was not found for 0.1.10.' }
          $studioText = $studioText.Replace('</body>', $gradientStudioPatch + "`r`n</body>")
          [IO.File]::WriteAllText($studioHtml, $studioText, [Text.UTF8Encoding]::new($false))

          # 0.1.11: add a global Color Studio and standard/recent/favorite color palettes.
          $colorStudioPatchPath = 'apps/ao3-skin-studio/patches/0.1.11/color-studio.html'
          if (-not (Test-Path $colorStudioPatchPath)) { throw 'AO3 Skin Studio 0.1.11 Color Studio patch was not found.' }
          $colorStudioPatch = Get-Content $colorStudioPatchPath -Raw
          $studioText = Get-Content $studioHtml -Raw
          if (-not $studioText.Contains('</body>')) { throw 'AO3 Skin Studio body closing tag was not found for 0.1.11.' }
          $studioText = $studioText.Replace('</body>', $colorStudioPatch + "`r`n</body>")
          [IO.File]::WriteAllText($studioHtml, $studioText, [Text.UTF8Encoding]::new($false))

          # 0.1.12: expose every AO3 required-tag grid/key state as an editable item.
          $allRequiredStatesPatchPath = 'apps/ao3-skin-studio/patches/0.1.12/all-required-grid-states.html'
          if (-not (Test-Path $allRequiredStatesPatchPath)) { throw 'AO3 Skin Studio 0.1.12 required-grid-state patch was not found.' }
          $allRequiredStatesPatch = Get-Content $allRequiredStatesPatchPath -Raw
          $studioText = Get-Content $studioHtml -Raw
          if (-not $studioText.Contains('</body>')) { throw 'AO3 Skin Studio body closing tag was not found for 0.1.12.' }
          $studioText = $studioText.Replace('</body>', $allRequiredStatesPatch + "`r`n</body>")
          [IO.File]::WriteAllText($studioHtml, $studioText, [Text.UTF8Encoding]::new($false))

          # 0.1.13: saved Desktop Shortcut setting.
          $appSettingsPath = Join-Path $srcRoot 'AO3SkinStudio/Models/AppSettings.cs'
          $appSettingsText = Get-Content $appSettingsPath -Raw
          $settingsAnchor = '    public bool AutoUpdate { get; set; } = true;'
          $settingsReplacement = @(
            '    public bool AutoUpdate { get; set; } = true;'
            '    public bool DesktopShortcut { get; set; } = false;'
          ) -join "`r`n"
          if (-not $appSettingsText.Contains($settingsAnchor)) { throw 'AppSettings desktop-shortcut anchor was not found.' }
          $appSettingsText = $appSettingsText.Replace($settingsAnchor, $settingsReplacement)
          [IO.File]::WriteAllText($appSettingsPath, $appSettingsText, [Text.UTF8Encoding]::new($false))

          $shortcutXamlPath = Join-Path $srcRoot 'AO3SkinStudio/MainWindow.xaml'
          $shortcutXamlText = Get-Content $shortcutXamlPath -Raw
          $shortcutXamlAnchor = '          <Button x:Name="UpdateButton" Content="Update" Click="Update_Click" />'
          $shortcutXamlInsert = @(
            '          <Button x:Name="UpdateButton" Content="Update" Click="Update_Click" />'
            '          <CheckBox x:Name="DesktopShortcutCheckBox"'
            '                    Content="Desktop Shortcut"'
            '                    ToolTip="Add or remove an AO3 Skin Studio shortcut on the Windows desktop."'
            '                    Foreground="{StaticResource TextMuted}"'
            '                    VerticalAlignment="Center"'
            '                    Margin="8,0,0,0"'
            '                    Checked="DesktopShortcut_Changed"'
            '                    Unchecked="DesktopShortcut_Changed" />'
          ) -join "`r`n"
          if (-not $shortcutXamlText.Contains($shortcutXamlAnchor)) { throw 'MainWindow Desktop Shortcut checkbox anchor was not found.' }
          $shortcutXamlText = $shortcutXamlText.Replace($shortcutXamlAnchor, $shortcutXamlInsert)
          [IO.File]::WriteAllText($shortcutXamlPath, $shortcutXamlText, [Text.UTF8Encoding]::new($false))

          $shortcutCodePath = Join-Path $srcRoot 'AO3SkinStudio/MainWindow.xaml.cs'
          $shortcutCodeText = Get-Content $shortcutCodePath -Raw
          $shortcutCodeNewline = if ($shortcutCodeText.Contains("`r`n")) { "`r`n" } else { "`n" }

          $shortcutLoadAnchor = '        AutoUpdateCheckBox.IsChecked = _settings.AutoUpdate;' + $shortcutCodeNewline + '        _loadingSettings = false;'
          $shortcutLoadReplacement = @(
            '        AutoUpdateCheckBox.IsChecked = _settings.AutoUpdate;'
            '        DesktopShortcutCheckBox.IsChecked = _settings.DesktopShortcut;'
            '        _loadingSettings = false;'
            ''
            '        try'
            '        {'
            '            SetDesktopShortcut(_settings.DesktopShortcut);'
            '        }'
            '        catch'
            '        {'
            '            _settings.DesktopShortcut = false;'
            '            _loadingSettings = true;'
            '            DesktopShortcutCheckBox.IsChecked = false;'
            '            _loadingSettings = false;'
            '            SettingsService.Save(_settings);'
            '        }'
          ) -join $shortcutCodeNewline
          if (-not $shortcutCodeText.Contains($shortcutLoadAnchor)) { throw 'MainWindow desktop-shortcut load anchor was not found.' }
          $shortcutCodeText = $shortcutCodeText.Replace($shortcutLoadAnchor, $shortcutLoadReplacement)

          $autoUpdateMethodAnchor = @(
            '    private void AutoUpdate_Changed(object sender, RoutedEventArgs e)'
            '    {'
            '        if (_loadingSettings)'
            '            return;'
            ''
            '        _settings.AutoUpdate = AutoUpdateCheckBox.IsChecked == true;'
            '        SettingsService.Save(_settings);'
            '    }'
          ) -join $shortcutCodeNewline

          $shortcutMethods = @(
            '    private void AutoUpdate_Changed(object sender, RoutedEventArgs e)'
            '    {'
            '        if (_loadingSettings)'
            '            return;'
            ''
            '        _settings.AutoUpdate = AutoUpdateCheckBox.IsChecked == true;'
            '        SettingsService.Save(_settings);'
            '    }'
            ''
            '    private void DesktopShortcut_Changed(object sender, RoutedEventArgs e)'
            '    {'
            '        if (_loadingSettings)'
            '            return;'
            ''
            '        var enabled = DesktopShortcutCheckBox.IsChecked == true;'
            ''
            '        try'
            '        {'
            '            SetDesktopShortcut(enabled);'
            '            _settings.DesktopShortcut = enabled;'
            '            SettingsService.Save(_settings);'
            '            StatusText.Text = enabled ? "Desktop shortcut added" : "Desktop shortcut removed";'
            '        }'
            '        catch (Exception ex)'
            '        {'
            '            _loadingSettings = true;'
            '            DesktopShortcutCheckBox.IsChecked = _settings.DesktopShortcut;'
            '            _loadingSettings = false;'
            '            MessageBox.Show(this, ex.Message, "Desktop Shortcut", MessageBoxButton.OK, MessageBoxImage.Warning);'
            '        }'
            '    }'
            ''
            '    private static string GetDesktopShortcutPath()'
            '    {'
            '        var desktop = Environment.GetFolderPath(Environment.SpecialFolder.DesktopDirectory);'
            '        return Path.Combine(desktop, "AO3 Skin Studio.lnk");'
            '    }'
            ''
            '    private static void SetDesktopShortcut(bool enabled)'
            '    {'
            '        var shortcutPath = GetDesktopShortcutPath();'
            ''
            '        if (!enabled)'
            '        {'
            '            if (File.Exists(shortcutPath))'
            '                File.Delete(shortcutPath);'
            '            return;'
            '        }'
            ''
            '        var exePath = Environment.ProcessPath;'
            '        if (string.IsNullOrWhiteSpace(exePath))'
            '            throw new InvalidOperationException("AO3 Skin Studio could not determine its executable path.");'
            ''
            '        var shellType = Type.GetTypeFromProgID("WScript.Shell");'
            '        if (shellType is null)'
            '            throw new InvalidOperationException("Windows shortcut support is not available on this computer.");'
            ''
            '        dynamic shell = Activator.CreateInstance(shellType)!;'
            '        dynamic shortcut = shell.CreateShortcut(shortcutPath);'
            '        shortcut.TargetPath = exePath;'
            '        shortcut.WorkingDirectory = AppContext.BaseDirectory;'
            '        shortcut.Description = "AO3 Skin Studio";'
            '        shortcut.IconLocation = exePath + ",0";'
            '        shortcut.Save();'
            '    }'
          ) -join $shortcutCodeNewline

          if (-not $shortcutCodeText.Contains($autoUpdateMethodAnchor)) { throw 'MainWindow AutoUpdate method anchor was not found for Desktop Shortcut patch.' }
          $shortcutCodeText = $shortcutCodeText.Replace($autoUpdateMethodAnchor, $shortcutMethods)
          [IO.File]::WriteAllText($shortcutCodePath, $shortcutCodeText, [Text.UTF8Encoding]::new($false))

          # 0.1.15: barebones Concepts / Starters library.
          $conceptsPatchPath = 'apps/ao3-skin-studio/patches/0.1.15/concepts-starters.html'
          if (-not (Test-Path $conceptsPatchPath)) { throw 'AO3 Skin Studio 0.1.15 Concepts / Starters patch was not found.' }
          $conceptsPatch = Get-Content $conceptsPatchPath -Raw
          $studioText = Get-Content $studioHtml -Raw
          if (-not $studioText.Contains('</body>')) { throw 'AO3 Skin Studio body closing tag was not found for 0.1.15.' }
          $studioText = $studioText.Replace('</body>', $conceptsPatch + "`r`n</body>")
          [IO.File]::WriteAllText($studioHtml, $studioText, [Text.UTF8Encoding]::new($false))

          # 0.1.16: first updater-delivered starter concept — Falling Angle.
          # The concept itself lives in the 0.1.15 Concepts / Starters patch and is loaded into Starter Library.

          # 0.1.17: resizable header + hide AO3 branding controls.
          $headerLayoutPatchPath = 'apps/ao3-skin-studio/patches/0.1.17/header-resize-and-branding.html'
          if (-not (Test-Path $headerLayoutPatchPath)) { throw 'AO3 Skin Studio 0.1.17 header-layout patch was not found.' }
          $headerLayoutPatch = Get-Content $headerLayoutPatchPath -Raw
          $studioText = Get-Content $studioHtml -Raw
          if (-not $studioText.Contains('</body>')) { throw 'AO3 Skin Studio body closing tag was not found for 0.1.17.' }
          $studioText = $studioText.Replace('</body>', $headerLayoutPatch + "`r`n</body>")
          [IO.File]::WriteAllText($studioHtml, $studioText, [Text.UTF8Encoding]::new($false))

          # 0.1.18: full-skin Randomizer tab inside Concepts / Starters.
          $randomizerPatchPath = 'apps/ao3-skin-studio/patches/0.1.18/skin-randomizer.html'
          if (-not (Test-Path $randomizerPatchPath)) { throw 'AO3 Skin Studio 0.1.18 skin-randomizer patch was not found.' }
          $randomizerPatch = Get-Content $randomizerPatchPath -Raw
          $studioText = Get-Content $studioHtml -Raw
          if (-not $studioText.Contains('</body>')) { throw 'AO3 Skin Studio body closing tag was not found for 0.1.18.' }
          $studioText = $studioText.Replace('</body>', $randomizerPatch + "`r`n</body>")
          [IO.File]::WriteAllText($studioHtml, $studioText, [Text.UTF8Encoding]::new($false))

          # 0.1.14: install and embed the AO3 Skin Studio app icon.
          $iconSource = 'apps/ao3-skin-studio/assets/AO3-Skin-Studio-Icon.ico'
          if (-not (Test-Path $iconSource)) { throw 'AO3 Skin Studio icon asset was not found.' }
          $iconDir = Join-Path $srcRoot 'AO3SkinStudio/Assets'
          New-Item -ItemType Directory -Path $iconDir -Force | Out-Null
          Copy-Item $iconSource (Join-Path $iconDir 'AO3-Skin-Studio-Icon.ico') -Force

          # Make desktop shortcuts use the shipped icon file when available.
          $iconShortcutCodePath = Join-Path $srcRoot 'AO3SkinStudio/MainWindow.xaml.cs'
          $iconShortcutCodeText = Get-Content $iconShortcutCodePath -Raw
          $iconShortcutAnchor = '        shortcut.IconLocation = exePath + ",0";'
          $iconShortcutNewline = if ($iconShortcutCodeText.Contains("`r`n")) { "`r`n" } else { "`n" }
          $iconShortcutReplacement = @(
            '        var iconPath = Path.Combine(AppContext.BaseDirectory, "Assets", "AO3-Skin-Studio-Icon.ico");'
            '        shortcut.IconLocation = File.Exists(iconPath) ? iconPath : exePath + ",0";'
          ) -join $iconShortcutNewline
          if (-not $iconShortcutCodeText.Contains($iconShortcutAnchor)) { throw 'Desktop shortcut icon anchor was not found.' }
          $iconShortcutCodeText = $iconShortcutCodeText.Replace($iconShortcutAnchor, $iconShortcutReplacement)
          [IO.File]::WriteAllText($iconShortcutCodePath, $iconShortcutCodeText, [Text.UTF8Encoding]::new($false))

          # 0.1.6: keep the native Windows title-bar buttons fully inside the visible work area.
          $mainWindowXaml = Join-Path $srcRoot 'AO3SkinStudio/MainWindow.xaml'
          $mainWindowXamlText = Get-Content $mainWindowXaml -Raw
          if (-not $mainWindowXamlText.Contains('WindowStartupLocation="CenterScreen"')) { throw 'MainWindow startup-location anchor was not found.' }
          $mainWindowXamlText = $mainWindowXamlText.Replace('WindowStartupLocation="CenterScreen"', 'WindowStartupLocation="Manual"')
          $mainWindowXamlText = $mainWindowXamlText.Replace('Height="940"', 'Height="900"')
          [IO.File]::WriteAllText($mainWindowXaml, $mainWindowXamlText, [Text.UTF8Encoding]::new($false))

          $mainWindowCode = Join-Path $srcRoot 'AO3SkinStudio/MainWindow.xaml.cs'
          $mainWindowCodeText = Get-Content $mainWindowCode -Raw
          $newline = if ($mainWindowCodeText.Contains("`r`n")) { "`r`n" } else { "`n" }

          $constructorAnchor = '        InitializeComponent();' + $newline + '        Loaded += MainWindow_Loaded;'
          $constructorReplacement = '        InitializeComponent();' + $newline + '        FitWindowToVisibleWorkArea();' + $newline + '        Loaded += MainWindow_Loaded;'
          if (-not $mainWindowCodeText.Contains($constructorAnchor)) { throw 'MainWindow constructor anchor was not found.' }
          $mainWindowCodeText = $mainWindowCodeText.Replace($constructorAnchor, $constructorReplacement)

          $loadedAnchor = '    private async void MainWindow_Loaded(object sender, RoutedEventArgs e)'
          $fitMethod = @(
            '    private void FitWindowToVisibleWorkArea()'
            '    {'
            '        var workArea = SystemParameters.WorkArea;'
            ''
            '        var targetWidth = Math.Min(1500d, Math.Max(320d, workArea.Width - 24d));'
            '        var targetHeight = Math.Min(900d, Math.Max(320d, workArea.Height - 24d));'
            ''
            '        MinWidth = Math.Min(MinWidth, targetWidth);'
            '        MinHeight = Math.Min(MinHeight, targetHeight);'
            '        MaxWidth = workArea.Width;'
            '        MaxHeight = workArea.Height;'
            ''
            '        Width = targetWidth;'
            '        Height = targetHeight;'
            '        Left = workArea.Left + Math.Max(0d, (workArea.Width - Width) / 2d);'
            '        Top = workArea.Top + Math.Max(0d, (workArea.Height - Height) / 2d);'
            '    }'
            ''
            ''
          ) -join $newline
          if (-not $mainWindowCodeText.Contains($loadedAnchor)) { throw 'MainWindow loaded-method anchor was not found.' }
          $mainWindowCodeText = $mainWindowCodeText.Replace($loadedAnchor, $fitMethod + $loadedAnchor)
          [IO.File]::WriteAllText($mainWindowCode, $mainWindowCodeText, [Text.UTF8Encoding]::new($false))

          $projectText = Get-Content $project -Raw

          # 0.1.14: embed the icon in AO3SkinStudio.exe and include the .ico in published updates.
          $useWpfAnchor = '<UseWPF>true</UseWPF>'
          if (-not $projectText.Contains($useWpfAnchor)) { throw 'AO3 project UseWPF anchor was not found for app icon.' }
          $projectText = $projectText.Replace($useWpfAnchor, $useWpfAnchor + "`r`n    <ApplicationIcon>Assets\AO3-Skin-Studio-Icon.ico</ApplicationIcon>")
          $projectEndAnchor = '</Project>'
          $iconItemGroup = @(
            '  <ItemGroup>'
            '    <Content Include="Assets\AO3-Skin-Studio-Icon.ico">'
            '      <CopyToOutputDirectory>PreserveNewest</CopyToOutputDirectory>'
            '      <CopyToPublishDirectory>PreserveNewest</CopyToPublishDirectory>'
            '    </Content>'
            '  </ItemGroup>'
            ''
          ) -join "`r`n"
          if (-not $projectText.Contains($projectEndAnchor)) { throw 'AO3 project closing tag was not found for app icon.' }
          $projectText = $projectText.Replace($projectEndAnchor, $iconItemGroup + $projectEndAnchor)

          $projectText = $projectText.Replace('<Version>0.1.0</Version>', '<Version>0.1.19</Version>')
          $projectText = $projectText.Replace('<AssemblyVersion>0.1.0.0</AssemblyVersion>', '<AssemblyVersion>0.1.19.0</AssemblyVersion>')
          $projectText = $projectText.Replace('<FileVersion>0.1.0.0</FileVersion>', '<FileVersion>0.1.19.0</FileVersion>')
          [IO.File]::WriteAllText($project, $projectText, [Text.UTF8Encoding]::new($false))

          # The app uses System.IO types throughout its settings, WebView, and updater services.
          Set-Content -Path (Join-Path $srcRoot 'AO3SkinStudio/GlobalUsings.cs') -Value "global using System.IO;" -Encoding utf8

          "AO3_PROJECT=$project" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "AO3_VERSION=0.1.19" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Publish Windows app
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $publish = Join-Path $env:RUNNER_TEMP 'ao3-publish'
          if (Test-Path $publish) { Remove-Item $publish -Recurse -Force }

          dotnet publish $env:AO3_PROJECT `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=false `
            -o $publish

          $exe = Join-Path $publish 'AO3SkinStudio.exe'
          if (-not (Test-Path $exe)) { throw 'AO3SkinStudio.exe was not produced.' }

          "AO3_PUBLISH=$publish" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build Windows installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          choco install innosetup --no-progress -y
          if ($LASTEXITCODE -ne 0) { throw 'Could not install Inno Setup on the build runner.' }

          $isccCandidates = @(
            (Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'),
            (Join-Path $env:ProgramFiles 'Inno Setup 6\ISCC.exe')
          )
          $iscc = $isccCandidates | Where-Object { $_ -and (Test-Path $_) } | Select-Object -First 1
          if (-not $iscc) { throw 'Inno Setup compiler was not found after installation.' }

          $installerBase = "AO3-Skin-Studio-Setup-$env:AO3_VERSION"
          $iss = Join-Path $env:RUNNER_TEMP 'ao3-skin-studio-installer.iss'
          $publishEscaped = $env:AO3_PUBLISH.Replace("\","\\")
          $outputEscaped = $env:RUNNER_TEMP.Replace("\","\\")

          @"
          [Setup]
          AppId={{C78E6370-6D44-4B21-99A7-6DDF4D88E515}
          AppName=AO3 Skin Studio
          AppVersion=$env:AO3_VERSION
          AppPublisher=VeyrStudio
          DefaultDirName={localappdata}\Programs\AO3 Skin Studio
          DefaultGroupName=AO3 Skin Studio
          DisableProgramGroupPage=yes
          OutputDir=$outputEscaped
          OutputBaseFilename=$installerBase
          UninstallDisplayIcon={app}\AO3SkinStudio.exe
          Compression=lzma2
          SolidCompression=yes
          WizardStyle=modern
          PrivilegesRequired=lowest
          ArchitecturesAllowed=x64compatible
          ArchitecturesInstallIn64BitMode=x64compatible
          CloseApplications=yes
          RestartApplications=no
          
          [Languages]
          Name: "english"; MessagesFile: "compiler:Default.isl"
          
          [Tasks]
          Name: "desktopicon"; Description: "Create a desktop shortcut"; GroupDescription: "Additional shortcuts:"; Flags: unchecked
          
          [Files]
          Source: "$publishEscaped\*"; DestDir: "{app}"; Flags: ignoreversion recursesubdirs createallsubdirs
          
          [Icons]
          Name: "{group}\AO3 Skin Studio"; Filename: "{app}\AO3SkinStudio.exe"
          Name: "{autodesktop}\AO3 Skin Studio"; Filename: "{app}\AO3SkinStudio.exe"; Tasks: desktopicon
          
          [Run]
          Filename: "{app}\AO3SkinStudio.exe"; Description: "Launch AO3 Skin Studio"; Flags: nowait postinstall skipifsilent
          "@ | Set-Content $iss -Encoding utf8

          & $iscc $iss
          if ($LASTEXITCODE -ne 0) { throw 'AO3 Skin Studio installer compilation failed.' }

          $installer = Join-Path $env:RUNNER_TEMP "$installerBase.exe"
          if (-not (Test-Path $installer)) { throw 'AO3 Skin Studio installer executable was not produced.' }

          "AO3_INSTALLER=$installer" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Sync latest main before release files
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git pull --rebase origin main
          if ($LASTEXITCODE -ne 0) { throw "Could not sync main before generating the AO3 Skin Studio update channel." }

      - name: Build verified update payload
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $channel = Join-Path $PWD 'ao3-skin-studio'
          New-Item -ItemType Directory -Path $channel -Force | Out-Null
          Get-ChildItem $channel -Filter 'payload-*.txt' -ErrorAction SilentlyContinue | Remove-Item -Force

          $zip = Join-Path $env:RUNNER_TEMP "AO3SkinStudio-$env:AO3_VERSION-win-x64.zip"
          if (Test-Path $zip) { Remove-Item $zip -Force }
          Compress-Archive -Path (Join-Path $env:AO3_PUBLISH '*') -DestinationPath $zip -CompressionLevel Optimal

          $payloadSha = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          $exe = Join-Path $env:AO3_PUBLISH 'AO3SkinStudio.exe'
          $exeSha = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          $exeBytes = (Get-Item $exe).Length
          $payloadBytes = (Get-Item $zip).Length

          $base64 = [Convert]::ToBase64String([IO.File]::ReadAllBytes($zip))
          $chunkSize = 20000000
          $parts = @()
          $partNumber = 1

          for ($offset = 0; $offset -lt $base64.Length; $offset += $chunkSize) {
            $length = [Math]::Min($chunkSize, $base64.Length - $offset)
            $chunk = $base64.Substring($offset, $length)
            $name = 'payload-{0}-part-{1:D3}.txt' -f $env:AO3_VERSION, $partNumber
            $partPath = Join-Path $channel $name
            [IO.File]::WriteAllText($partPath, $chunk, [Text.UTF8Encoding]::new($false))
            $partSha = (Get-FileHash $partPath -Algorithm SHA256).Hash.ToLowerInvariant()
            $parts += [ordered]@{
              url = "https://raw.githubusercontent.com/VeyrStudio/DesktopAppUpdates/main/ao3-skin-studio/$name"
              sha256 = $partSha
            }
            $partNumber++
          }

          $manifest = [ordered]@{
            schemaVersion = 1
            appId = 'ao3-skin-studio-wpf'
            appName = 'AO3 Skin Studio'
            version = $env:AO3_VERSION
            payloadSha256 = $payloadSha
            executableSha256 = $exeSha
            payloadParts = $parts
            notes = 'Adds a normal Windows installer build for AO3 Skin Studio. Version 0.1.19 can be installed from a single AO3-Skin-Studio-Setup executable instead of extracting a ZIP. The installer uses a per-user install location, creates a Start Menu shortcut, optionally creates a desktop shortcut, carries the app icon, and can launch the app when setup finishes. The automatic updater remains unchanged for already-installed copies. Keeps the Randomizer, Glorious Purpose, Falling Angle, resizable header controls, Concepts / Starters, and all prior tools.'
          }
          $manifest | ConvertTo-Json -Depth 8 | Set-Content (Join-Path $channel 'manifest.json') -Encoding utf8

          $validation = [ordered]@{
            version = $env:AO3_VERSION
            executableSha256 = $exeSha
            executableBytes = $exeBytes
            payloadSha256 = $payloadSha
            payloadBytes = $payloadBytes
            payloadPartCount = $parts.Count
          }
          $validation | ConvertTo-Json -Depth 5 | Set-Content (Join-Path $channel "$env:AO3_VERSION-validation.json") -Encoding utf8

          @"
          # AO3 Skin Studio update channel

          Automatic-update files for **AO3 Skin Studio** are generated by `.github/workflows/build-ao3-skin-studio-wpf.yml`.

          The app checks `manifest.json` in this folder. User settings and WebView2 data are stored outside the application folder so updates do not overwrite them.
          "@ | Set-Content (Join-Path $channel 'README.md') -Encoding utf8

          Copy-Item $zip (Join-Path $env:RUNNER_TEMP 'AO3SkinStudio-release.zip') -Force

      - name: Commit update channel
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git config user.name "VeyrStudio Update Builder"
          git config user.email "actions@users.noreply.github.com"
          git add ao3-skin-studio
          if (git diff --cached --quiet) {
            Write-Host 'AO3 Skin Studio update channel already matches this build.'
          } else {
            git commit -m "Release AO3 Skin Studio $env:AO3_VERSION"
            if ($LASTEXITCODE -ne 0) { throw "Could not commit AO3 Skin Studio release files." }
            git push origin HEAD:main
            if ($LASTEXITCODE -ne 0) { throw "Could not push AO3 Skin Studio release files." }
          }

      - uses: actions/upload-artifact@v4
        with:
          name: AO3SkinStudio-win-x64-${{ env.AO3_VERSION }}
          path: ${{ runner.temp }}/AO3SkinStudio-release.zip
          if-no-files-found: error

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: AO3SkinStudio-Installer-${{ env.AO3_VERSION }}
          path: ${{ env.AO3_INSTALLER }}
          if-no-files-found: error
