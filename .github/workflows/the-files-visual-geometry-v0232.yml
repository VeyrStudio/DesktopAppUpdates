name: The Files Visual Geometry v0.2.32
on:
  push:
    paths:
      - 'tools/the-files-visual-geometry-v0232.py'
      - '.github/workflows/the-files-visual-geometry-v0232.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Build visual geometry release
        shell: pwsh
        run: python tools/the-files-visual-geometry-v0232.py
      - name: Parse launcher and core under Windows PowerShell
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          foreach($f in @('.visual-v0232-validation/TheFiles.ps1','.visual-v0232-validation/TheFilesCore.ps1')){
            $tokens=$null;$errors=$null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $f),[ref]$tokens,[ref]$errors)|Out-Null
            if($errors.Count -gt 0){$errors|ForEach-Object{Write-Error (($_.Extent.StartLineNumber.ToString())+': '+$_.Message)};throw "PowerShell parse failed: $f"}
          }
      - name: Revalidate package and geometry markers
        shell: python
        run: |
          import json,pathlib,hashlib,base64,gzip
          r=pathlib.Path('.');v=json.loads((r/'the-files/visual-geometry-0.2.32-validation.json').read_text());b=(r/'the-files'/v['payload']).read_bytes();assert hashlib.sha256(b).hexdigest()==v['payloadSha256'];p=json.loads(b.decode());assert p['version']=='0.2.32';fs={f['path']:f for f in p['files']}
          for f in p['files']:
              data=base64.b64decode(f['contentBase64']);assert hashlib.sha256(data).hexdigest()==f['sha256'],f['path']
          raw=base64.b64decode(fs['TheFilesCore.ps1']['contentBase64']);assert gzip.decompress(base64.b64decode(fs['TheFilesCore.ps1.gz']['contentBase64']))==raw;c=raw.decode('utf-8-sig')
          for marker in ['GraphicsPath PagePath','public bool Mirror','public class LeatherNavButton','function Get-SectionTabText','Render-MoodBoardEditor $rightContainer $r 220','function Apply-BookMasterSkin','function Render-NotesSection','function Render-TimelineSection','function Render-PowersSection']:
              assert marker in c,marker
      - name: Mark validation and commit
        shell: pwsh
        run: |
          $p='the-files/visual-geometry-0.2.32-validation.json';$r=Get-Content $p -Raw|ConvertFrom-Json;$r|Add-Member -NotePropertyName powershellParse -NotePropertyValue 'passed-windows-powershell-parser' -Force;$r|ConvertTo-Json -Depth 10|Set-Content $p -Encoding UTF8
          git config user.name 'VeyrStudio Update Bot';git config user.email 'actions@users.noreply.github.com'
          git add 'the-files/payload-0.2.32-visual-geometry-part-001.txt' 'the-files/visual-geometry-0.2.32-validation.json';git diff --cached --quiet
          if($LASTEXITCODE -ne 0){git commit -m 'Stage validated The Files v0.2.32 visual geometry';git pull --rebase origin main;git push origin main}
