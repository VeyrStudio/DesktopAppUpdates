<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <title>The Ledger</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div id="app" class="app-shell" data-size="medium">
      <aside class="sidebar" aria-label="Main navigation">
        <div class="brand">
          <img src="../build/icon.png" alt="" />
          <div>
            <strong>The Ledger</strong>
            <span>Private academic archive</span>
          </div>
        </div>
        <nav id="main-nav">
          <button class="nav-item active" data-view="today" type="button">
            <span class="nav-icon" aria-hidden="true">▣</span><span>Today</span>
          </button>
          <button class="nav-item" data-view="classes" type="button">
            <span class="nav-icon" aria-hidden="true">▤</span><span>Classes</span>
          </button>
          <button class="nav-item" data-view="notebook" type="button">
            <span class="nav-icon" aria-hidden="true">▧</span><span>Notebook</span>
          </button>
          <button class="nav-item" data-view="review" type="button">
            <span class="nav-icon" aria-hidden="true">◇</span><span>Review</span>
          </button>
          <button class="nav-item" data-view="search" type="button">
            <span class="nav-icon" aria-hidden="true">⌕</span><span>Search</span>
          </button>
          <button class="nav-item" data-view="settings" type="button">
            <span class="nav-icon" aria-hidden="true">⚙</span><span>Settings</span>
          </button>
        </nav>
        <div class="sidebar-footer">
          <span id="sidebar-status">Ready</span>
          <span id="sidebar-version">v0.1.0</span>
        </div>
      </aside>

      <section class="workspace">
        <header class="topbar">
          <div>
            <h1 id="page-title">Today</h1>
            <p id="page-subtitle"></p>
          </div>
          <div class="topbar-actions">
            <button id="quick-search" class="icon-button" type="button" aria-label="Search">⌕</button>
            <button id="notification-button" class="icon-button notification-button" type="button" aria-label="Notifications">
              ♢<span id="notification-badge" class="notification-badge" hidden>0</span>
            </button>
          </div>
        </header>
        <main id="view" tabindex="-1"></main>
      </section>
    </div>

    <aside id="notification-panel" class="drawer" aria-label="Notifications" hidden>
      <div class="drawer-header">
        <div><span class="eyebrow">THE LEDGER</span><h2>Notifications</h2></div>
        <button class="icon-button" data-close-drawer type="button" aria-label="Close">×</button>
      </div>
      <div class="drawer-actions"><button id="mark-all-read" class="text-button" type="button">Mark all read</button></div>
      <div id="notification-list" class="notification-list"></div>
    </aside>

    <div id="modal-backdrop" class="modal-backdrop" hidden>
      <section id="modal" class="modal" role="dialog" aria-modal="true"></section>
    </div>

    <div id="status-announcer" class="visually-hidden" aria-live="polite"></div>
    <script type="module" src="app.js"></script>
  </body>
</html>
