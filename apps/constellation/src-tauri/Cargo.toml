[package]
name = "constellation"
version = "0.1.0"
description = "Constellation ships and fandoms desktop app"
authors = ["VeyrStudio"]
edition = "2021"

[lib]
name = "constellation_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
sha2 = "0.10"
hex = "0.4"
semver = "1"
