<style id="ao3-gif-and-correct-required-grid-styles">

  position:relative;
  padding-left:86px !important;
  min-height:92px;

  bottom:auto !important;
  float:none !important;
  display:grid !important;
  grid-template-columns:repeat(2,30px) !important;
  grid-template-rows:repeat(2,30px) !important;
  gap:4px !important;
  width:64px !important;
  height:64px !important;
  margin:0 !important;
  padding:0 !important;
  list-style:none !important;
}

#mock .preview-result-card .preview-required-tags li,
#mock .preview-result-card .required-tags li{
  display:block !important;
  width:30px !important;

  min-width:30px !important;
  margin:0 !important;
  padding:0 !important;

#mock .preview-result-card .required-tags li > span{
  display:flex !important;
  align-items:center !important;
  justify-content:center !important;
  width:30px !important;

  box-sizing:border-box !important;

  border:1px solid var(--p-border) !important;

  font-family:var(--req-font,var(--p-font)) !important;
  font-size:var(--req-size,11px) !important;
  font-weight:800 !important;
  line-height:1 !important;
  overflow:hidden !important;

#mock .preview-result-card .required-tags .text{
  display:none !important;

/* Visible compact labels, while the full accessible text remains in the markup. */
#mock .rating-general-audience::after{content:"G"}
#mock .rating-teen::after{content:"T"}
#mock .rating-mature::after{content:"M"}
#mock .rating-explicit::after{content:"E"}
#mock .rating-notrated::after{content:"NR"}
#mock .warning-no::after{content:"✓"}
#mock .warning-choosenotto::after{content:"?"}
#mock .warning-yes::after{content:"!"}
#mock .category-slash::after{content:"M/M";font-size:.78em}
#mock .category-femslash::after{content:"F/F";font-size:.78em}
#mock .category-het::after{content:"F/M";font-size:.78em}
#mock .category-gen::after{content:"Gen";font-size:.74em}
#mock .category-multi::after{content:"Multi";font-size:.58em}
#mock .category-other::after{content:"Other";font-size:.52em}
#mock .category-none::after{content:"—"}
#mock .complete-yes::after{content:"✓"}
#mock .complete-no::after{content:"WIP";font-size:.68em}
#mock .external-work::after{content:"Ext";font-size:.68em}

/* Undo the old responsive conversion that made the grid stack into rows. */
.browser.responsive-preview-tablet #mock .preview-result-card .preview-required-tags,
.browser.responsive-preview-tablet #mock .preview-result-card .required-tags,
.browser.responsive-preview-mobile #mock .preview-result-card .preview-required-tags,
.browser.responsive-preview-mobile #mock .preview-result-card .required-tags{
  grid-template-columns:repeat(2,30px) !important;
  grid-template-rows:repeat(2,30px) !important;
  width:64px !important;
  height:64px !important;
}

.gif-support-note{
  margin-top:8px;
  padding:9px 10px;
  border:1px solid #3b3140;
  border-radius:8px;
  background:#111014;
  color:#b8aab6;
  font-size:9px;
  line-height:1.45;
}
.gif-badge{
  display:inline-flex;
  align-items:center;
  margin-left:6px;
  padding:2px 5px;
  border:1px solid #69427c;
  border-radius:999px;
  background:#2a1734;
  color:#dfb8f2;
  font-size:7px;
  font-weight:900;
  letter-spacing:.05em;
  vertical-align:middle;
}
</style>

<script id="ao3-gif-and-correct-required-grid-script">
(function(){
  const q=id=>document.getElementById(id);

  /* ----- Explicit animated GIF support ----- */
  const bgFile=q('bgFile');
  const bottomFile=q('bottomBorderFile');

  if(bgFile){
    bgFile.setAttribute('accept','image/png,image/jpeg,image/gif,.gif,image/webp');
  }
  if(bottomFile){
    bottomFile.setAttribute('accept','image/png,image/jpeg,image/gif,.gif,image/webp');
  }

  const backgroundSection=Array.from(document.querySelectorAll('details.section')).find(s =>
    (s.querySelector('summary')?.textContent || '').trim()==='Background'
  );

  if(backgroundSection && !backgroundSection.querySelector('.gif-support-note')){
    const imageControl=q('bgFile')?.closest('.control');
    if(imageControl){
      imageControl.insertAdjacentHTML('beforeend',
        '<div class="gif-support-note"><strong>Animated GIFs supported.</strong> GIF files stay animated in the live preview. For the finished AO3 skin, paste a direct hosted <code>.gif</code> URL into the image URL field just like PNG/JPG/WebP.</div>');
    }
  }

  function isGifImage(img){
    const name=(img?.name || '').toLowerCase();
    const data=(img?.data || '').toLowerCase();
    const url=(img?.url || '').toLowerCase().split('?')[0].split('#')[0];
    return name.endsWith('.gif') || data.startsWith('data:image/gif') || url.endsWith('.gif');
  }

  try{
    const previousRenderImageList=renderImageList;
    renderImageList=function(){
      previousRenderImageList();
      document.querySelectorAll('.image-card').forEach(card=>{
        const id=Number(card.dataset.id);
        const img=localImages.find(x=>x.id===id);
        if(!img || !isGifImage(img)) return;

        const sub=card.querySelector('.image-card-sub');
        if(sub && !sub.querySelector('.gif-badge')){
          sub.insertAdjacentHTML('beforeend','<span class="gif-badge">ANIMATED GIF</span>');
        }

        const urlInput=card.querySelector('input[data-field="url"]');
        if(urlInput) urlInput.placeholder='https://.../animation.gif';
      });
    };
  }catch(e){}

  // Windows occasionally reports a .gif with a blank MIME type. Handle that too.
  if(bgFile){
    bgFile.addEventListener('change',e=>{
      const files=Array.from(e.target.files || []);
      const special=files.filter(f=>!f.type && /\.gif$/i.test(f.name));
      if(!special.length) return;

      e.stopImmediatePropagation();

      const readFile=file=>new Promise((resolve,reject)=>{
        const reader=new FileReader();
        reader.onload=ev=>resolve({
          id:imageSeq++,
          name:file.name,
          data:ev.target.result,
          url:'',
          placement:'background',
          position:'center center',
          fit:'cover',
          opacity:100
        });
        reader.onerror=reject;
        reader.readAsDataURL(file);
      });

      Promise.all(special.map(readFile)).then(added=>{
        localImages.push(...added);
        bgFile.value='';
        renderImageList();
        update();
        if(q('bgLocalNote')){
          q('bgLocalNote').innerHTML='<strong>'+localImages.length+' image'+(localImages.length===1?'':'s')+' loaded.</strong> Animated GIFs remain animated in preview.';
        }
        showToast(added.length+' animated GIF'+(added.length===1?'':'s')+' added');
      }).catch(()=>showToast('The GIF could not be loaded'));
    },true);
  }

  if(bottomFile){
    bottomFile.addEventListener('change',e=>{
      const file=(e.target.files || [])[0];
      if(!file || file.type || !/\.gif$/i.test(file.name)) return;

      e.stopImmediatePropagation();
      const reader=new FileReader();
      reader.onload=ev=>{
        bottomBorderImage={data:ev.target.result,name:file.name};
        bottomFile.value='';
        update();
        if(q('bottomBorderStatus')) q('bottomBorderStatus').textContent='ANIMATED GIF';
        showToast('Animated bottom-border GIF added');
      };
      reader.onerror=()=>showToast('Could not load the GIF');
      reader.readAsDataURL(file);
    },true);

    bottomFile.addEventListener('change',()=>{
      setTimeout(()=>{
        if(isGifImage(bottomBorderImage) && q('bottomBorderStatus')){
          q('bottomBorderStatus').textContent='ANIMATED GIF';
        }
      },0);
    });
  }

  q('bottomBorderUrl')?.addEventListener('input',()=>{
    setTimeout(()=>{
      const url=(q('bottomBorderUrl').value || '').toLowerCase().split('?')[0].split('#')[0];
      if(url.endsWith('.gif') && q('bottomBorderStatus')){
        q('bottomBorderStatus').textContent='GIF URL';
      }
    },0);
  });

  try{ renderImageList(); }catch(e){}

  /* ----- Correct the exported AO3 required-tags block ----- */
  const previousBuildCss=buildCss;
  buildCss=function(){
    const css=previousBuildCss();
    return css + `

/* AO3 REQUIRED TAGS — COMPACT 2×2 BLOCK */
.blurb {
  position: relative;
  padding-left: 5.6em !important;
  min-height: 5.4em;
}

.blurb ul.required-tags {
  position: absolute !important;
  top: 1em !important;
  left: 1em !important;
  right: auto !important;
  bottom: auto !important;
  float: none !important;
  display: grid !important;
  grid-template-columns: repeat(2, 2.15em) !important;
  grid-template-rows: repeat(2, 2.15em) !important;
  gap: 0.28em !important;
  width: 4.58em !important;
  height: 4.58em !important;
  margin: 0 !important;
  padding: 0 !important;
  list-style: none !important;
}

.blurb ul.required-tags li {
  display: block !important;
  width: 2.15em !important;
  height: 2.15em !important;
  margin: 0 !important;
  padding: 0 !important;
  list-style: none !important;
}

.blurb ul.required-tags li > span,
.blurb ul.required-tags li > a,
.blurb ul.required-tags li > strong {
  display: flex !important;
  align-items: center !important;
  justify-content: center !important;
  width: 2.15em !important;
  height: 2.15em !important;
  min-height: 2.15em !important;
  box-sizing: border-box !important;
  padding: 0.12em !important;
  border: 1px solid ${q('borderColor').value.toUpperCase()} !important;
  border-radius: 0.22em !important;
  background-image: none !important;
  background-repeat: no-repeat !important;
  text-align: center !important;
  text-indent: 0 !important;
  overflow: hidden !important;
}

.blurb ul.required-tags .text {
  display: none !important;
}

/* Compact visible labels; the original hidden text remains available in AO3 markup. */
.blurb ul.required-tags .rating-general-audience::after { content: "G"; }
.blurb ul.required-tags .rating-teen::after { content: "T"; }
.blurb ul.required-tags .rating-mature::after { content: "M"; }
.blurb ul.required-tags .rating-explicit::after { content: "E"; }
.blurb ul.required-tags .rating-notrated::after { content: "NR"; font-size: .72em; }

.blurb ul.required-tags .warning-no::after { content: "✓"; }
.blurb ul.required-tags .warning-choosenotto::after { content: "?"; }
.blurb ul.required-tags .warning-yes::after { content: "!"; }

.blurb ul.required-tags .category-slash::after { content: "M/M"; font-size: .68em; }
.blurb ul.required-tags .category-femslash::after { content: "F/F"; font-size: .68em; }
.blurb ul.required-tags .category-het::after { content: "F/M"; font-size: .68em; }
.blurb ul.required-tags .category-gen::after { content: "Gen"; font-size: .64em; }
.blurb ul.required-tags .category-multi::after { content: "Multi"; font-size: .50em; }
.blurb ul.required-tags .category-other::after { content: "Other"; font-size: .46em; }
.blurb ul.required-tags .category-none::after { content: "—"; }

.blurb ul.required-tags .complete-yes::after { content: "✓"; }
.blurb ul.required-tags .complete-no::after { content: "WIP"; font-size: .60em; }
.blurb ul.required-tags .external-work::after { content: "Ext"; font-size: .60em; }

/* Keep it 2×2 on tablet and phones as well. */
@media only screen and (max-width: 64em) {
  .blurb ul.required-tags {
    grid-template-columns: repeat(2, 2.15em) !important;
    grid-template-rows: repeat(2, 2.15em) !important;
    width: 4.58em !important;
    height: 4.58em !important;
  }
}

@media only screen and (max-width: 42em) {
  .blurb {
    padding-left: 5.3em !important;
  }

  .blurb ul.required-tags {
    grid-template-columns: repeat(2, 2.05em) !important;
    grid-template-rows: repeat(2, 2.05em) !important;
    width: 4.38em !important;
    height: 4.38em !important;
  }
}
`;
  };

  try{
    cssOutput.value=buildCss();
    save();
  }catch(e){}
})();
</script>
