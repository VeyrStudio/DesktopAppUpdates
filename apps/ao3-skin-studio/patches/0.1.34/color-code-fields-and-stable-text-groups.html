<style id="ao3-color-code-stable-text-panel-styles">
/* 0.1.34 — universal color-code fields + rebuilt stable Text group picker */
.color-code-pair{
  display:grid!important;
  grid-template-columns:42px minmax(86px,1fr)!important;
  gap:6px!important;
  align-items:center!important;
  width:100%!important;
}
.color-code-pair > input[type="color"]{
  width:42px!important;
  min-width:42px!important;
  height:32px!important;
  padding:2px!important;
}
.color-code-text{
  width:100%!important;
  min-width:0!important;
  box-sizing:border-box!important;
  height:32px!important;
  padding:6px 8px!important;
  border:1px solid #493b4c!important;
  border-radius:5px!important;
  background:#0b090d!important;
  color:#e7dbe4!important;
  font:800 8px/1.2 ui-monospace,SFMono-Regular,Consolas,monospace!important;
  letter-spacing:.03em!important;
}
.color-code-text.invalid{
  border-color:#a33!important;
  box-shadow:0 0 0 1px rgba(170,50,50,.28)!important;
}

#stableTextEditor{
  margin:0 0 10px;
}
#stableTextGroupButtons{
  display:flex;
  flex-wrap:wrap;
  gap:6px;
  margin:0 0 10px;
}
.stable-text-group-button{
  appearance:none;
  border:1px solid #493b4c;
  border-radius:6px;
  background:#131015;
  color:#b9adb6;
  padding:8px 10px;
  font-size:8px;
  font-weight:900;
  cursor:pointer;
}
.stable-text-group-button:hover{
  background:#201923;
  color:#f2e8ef;
}
.stable-text-group-button.active{
  border-color:#a47948;
  background:#251b28;
  color:#f5e2c6;
  box-shadow:inset 0 -2px 0 #a47948;
}
#stableTextGroupSelect{
  width:100%;
  min-height:34px;
  box-sizing:border-box;
  margin-bottom:10px;
  border:1px solid #493b4c;
  border-radius:6px;
  background:#0c0a0e;
  color:#eee2e9;
  padding:6px 8px;
  font-size:9px;
  font-weight:800;
}
#stableTextGroupName{
  margin:0 0 8px;
  color:#eadde6;
  font-size:11px;
  font-weight:900;
}
#stableTextGroupHost .text-style-group{
  display:none!important;
}
#stableTextGroupHost .text-style-group.stable-active{
  display:block!important;
}
#stableTextEditor .text-style-subtabs,
#stableTextEditor .text-group-picker{
  display:none!important;
}
</style>

<script id="ao3-color-code-stable-text-panel-script">
(function(){
  const q=id=>document.getElementById(id);

  /* ---------- UNIVERSAL COLOR CODE INPUTS ---------- */
  function validHex(v){
    const s=String(v||'').trim();
    if(/^#[0-9a-f]{6}$/i.test(s)) return s.toUpperCase();
    if(/^[0-9a-f]{6}$/i.test(s)) return ('#'+s).toUpperCase();
    if(/^#[0-9a-f]{3}$/i.test(s)){
      const a=s.slice(1).split('');
      return ('#'+a.map(c=>c+c).join('')).toUpperCase();
    }
    if(/^[0-9a-f]{3}$/i.test(s)){
      const a=s.split('');
      return ('#'+a.map(c=>c+c).join('')).toUpperCase();
    }
    return null;
  }

  function addCodeField(color){
    if(!color || color.dataset.codeFieldReady==='1') return;
    if(color.closest('.color-code-pair')) return;
    color.dataset.codeFieldReady='1';

    const parent=color.parentElement;
    if(!parent) return;

    const wrap=document.createElement('span');
    wrap.className='color-code-pair';
    parent.insertBefore(wrap,color);
    wrap.appendChild(color);

    const code=document.createElement('input');
    code.type='text';
    code.className='color-code-text';
    code.autocomplete='off';
    code.spellcheck=false;
    code.value=String(color.value||'#000000').toUpperCase();
    code.setAttribute('aria-label','Color code');
    wrap.appendChild(code);

    color.addEventListener('input',()=>{
      code.value=String(color.value||'').toUpperCase();
      code.classList.remove('invalid');
    });

    code.addEventListener('input',()=>{
      const hex=validHex(code.value);
      if(!hex){
        code.classList.add('invalid');
        return;
      }
      code.classList.remove('invalid');
      const lower=hex.toLowerCase();
      if(color.value!==lower){
        color.value=lower;
        color.dispatchEvent(new Event('input',{bubbles:true}));
        color.dispatchEvent(new Event('change',{bubbles:true}));
      }
      code.value=hex;
    });

    code.addEventListener('blur',()=>{
      const hex=validHex(code.value);
      if(hex){
        code.value=hex;
        code.classList.remove('invalid');
      }else{
        code.value=String(color.value||'#000000').toUpperCase();
        code.classList.remove('invalid');
      }
    });
  }

  function scanColors(root=document){
    root.querySelectorAll?.('input[type="color"]').forEach(addCodeField);
  }

  scanColors();
  const colorObserver=new MutationObserver(records=>{
    records.forEach(r=>r.addedNodes.forEach(n=>{
      if(n.nodeType!==1)return;
      if(n.matches?.('input[type="color"]')) addCodeField(n);
      scanColors(n);
    }));
  });
  colorObserver.observe(document.body,{childList:true,subtree:true});

  /* ---------- REBUILD THE TEXT GROUP SELECTOR ---------- */
  const textPanel=q('editorSectionPanel_text');
  const oldWorkspace=textPanel?.querySelector('.text-style-workspace');
  const oldGroupHost=oldWorkspace?.querySelector('.text-style-groups');

  const groups=[
    {id:'title',name:'Title'},
    {id:'author',name:'Author'},
    {id:'tags',name:'Tags'},
    {id:'summary',name:'Summary'},
    {id:'main',name:'Main Fic Text'},
    {id:'info',name:'Fic Info / Meta'},
    {id:'notes',name:'Notes'},
    {id:'stats',name:'Stats'},
    {id:'interface',name:'Interface'}
  ];

  if(textPanel && oldWorkspace && oldGroupHost && !q('stableTextEditor')){
    const stable=document.createElement('div');
    stable.id='stableTextEditor';
    stable.className='editor-native-card';
    stable.innerHTML=
      '<h3 style="margin:0 0 5px">Text</h3>'+
      '<p style="margin:0 0 9px;color:#8f838d;font-size:8px;line-height:1.45">Pick exactly which AO3 text you want to edit.</p>'+
      '<select id="stableTextGroupSelect">'+
        groups.map(g=>'<option value="'+g.id+'">'+g.name+'</option>').join('')+
      '</select>'+
      '<div id="stableTextGroupButtons">'+
        groups.map(g=>'<button type="button" class="stable-text-group-button" data-group="'+g.id+'">'+g.name+'</button>').join('')+
      '</div>'+
      '<div id="stableTextGroupName"></div>'+
      '<div id="stableTextGroupHost"></div>';

    textPanel.insertBefore(stable,textPanel.firstChild);

    const host=q('stableTextGroupHost');
    groups.forEach(g=>{
      const box=q('textStyleGroup_'+g.id);
      if(box) host.appendChild(box);
    });

    /* Keep the old wrapper out of the way; its actual group controls have been moved. */
    oldWorkspace.style.display='none';

    const select=q('stableTextGroupSelect');
    const name=q('stableTextGroupName');

    function activate(id,scroll=false){
      const wanted=groups.some(g=>g.id===id)?id:'title';
      groups.forEach(g=>{
        const box=q('textStyleGroup_'+g.id);
        if(box){
          box.classList.toggle('stable-active',g.id===wanted);
          box.classList.toggle('active',g.id===wanted);
          box.style.display=g.id===wanted?'block':'none';
        }
      });

      q('stableTextGroupButtons')?.querySelectorAll('[data-group]').forEach(btn=>{
        btn.classList.toggle('active',btn.dataset.group===wanted);
      });

      if(select) select.value=wanted;
      if(name) name.textContent=groups.find(g=>g.id===wanted)?.name||'Text';

      /* Keep older APIs/state in sync too. */
      try{window.AO3TextGroupSelector?.activate?.(wanted)}catch(e){}
      const oldTab=document.querySelector('.text-style-subtab[data-text-group="'+wanted+'"]');
      oldTab?.classList.add('active');

      if(scroll) q('textStyleGroup_'+wanted)?.scrollIntoView?.({behavior:'smooth',block:'nearest'});
    }

    select?.addEventListener('change',()=>activate(select.value,true));

    q('stableTextGroupButtons')?.addEventListener('click',e=>{
      const btn=e.target.closest('[data-group]');
      if(!btn)return;
      e.preventDefault();
      e.stopPropagation();
      activate(btn.dataset.group,true);
    },true);

    /* Preview click-to-edit routes into this selector too. */
    document.addEventListener('click',e=>{
      const mock=q('mock');
      if(!mock?.contains(e.target)) return;
      const el=e.target;
      let id=null;
      if(el.closest('.preview-result-card > h4 > a')) return;
      if(el.closest('.preview-result-card > h4,.preview-fic-title,#workskin > h2.heading.preview-fic-title')) id='title';
      else if(el.closest('.mock-panel .meta,.byline,.byline a,[rel="author"]')) id='author';
      else if(el.closest('.preview-result-card .tags,.preview-result-card .tag,.preview-fic-meta a.tag')) id='tags';
      else if(el.closest('.stats,dl.stats')) id='stats';
      else if(el.closest('.notes,.preface .notes,.afterword .notes,.end.notes')) id='notes';
      else if(el.closest('.preview-fic-summary,.preview-result-card > .summary')) id='summary';
      else if(el.closest('.preview-fic-chapter p,#chapters .userstuff p,.chapter .userstuff p')) id='main';
      else if(el.closest('.preview-fic-meta dt,.preview-fic-meta dd')) id='info';
      else if(el.closest('.ao3-logo,.ao3-user,.ao3-nav,.mock-actions,.mock-btn,.ao3-footer,.actions,.navigation,.menu')) id='interface';

      if(id){
        setTimeout(()=>{
          try{window.AO3EditorSectionTabs?.show?.('text')}catch(e){}
          activate(id,true);
        },0);
      }
    },true);

    window.AO3StableTextEditor={activate};
    activate('title');
  }

  /* If anything later rebuilds color controls, rescan. */
  document.addEventListener('click',()=>setTimeout(()=>scanColors(),0),true);
})();
</script>
