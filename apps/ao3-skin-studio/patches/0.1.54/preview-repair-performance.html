<script id="ao3-preview-repair-v54-script">
(function(){
  const q=id=>document.getElementById(id);
  const mock=q('mock');
  if(!mock||q('ao3PreviewRepairSentinelV54'))return;

  const sentinel=document.createElement('span');
  sentinel.id='ao3PreviewRepairSentinelV54';
  sentinel.hidden=true;
  document.body.appendChild(sentinel);

  function ensureHeader(){
    const main=mock.querySelector('.ao3-main');
    if(!main)return null;

    let header=q('ao3HeaderPreview') || mock.querySelector('.ao3-header');
    if(!header){
      header=document.createElement('header');
      header.id='ao3HeaderPreview';
      header.className='ao3-header';
    }

    header.id='ao3HeaderPreview';
    header.classList.add('ao3-header-v54');
    header.dataset.previewHeaderV54='1';
    header.style.removeProperty('display');

    /* The page/background region begins AFTER the real AO3 header. Keep the
       header outside it so background images cannot replace or swallow it. */
    const region=q('mockPageRegion');
    if(region){
      if(header.parentElement!==mock || header.nextElementSibling!==region){
        mock.insertBefore(header,region);
      }
    }else if(header.parentElement!==mock || header.nextElementSibling!==main){
      main.insertAdjacentElement('beforebegin',header);
    }

    let stack=header.querySelector('#headerImageStack');
    if(!stack){
      stack=document.createElement('div');
      stack.id='headerImageStack';
      stack.className='header-image-stack';
      header.insertBefore(stack,header.firstChild);
    }

    if(!header.querySelector('.ao3-header-main-v54')){
      /* Preserve image overlays / resize handles, replace only the old basic
         AO3 heading/nav chrome with the complete logged-in preview chrome. */
      header.querySelectorAll(':scope > .ao3-heading,:scope > .ao3-nav:not(.ao3-primary-v54),:scope > .ao3-user-links-v54').forEach(x=>x.remove());

      const mainRow=document.createElement('div');
      mainRow.className='ao3-header-main-v54';
      mainRow.innerHTML=
        '<div class="ao3-logo ao3-logo-v54"><a href="#">Archive of Our Own</a><sup>beta</sup></div>'+
        '<nav class="ao3-user ao3-user-v54" aria-label="User navigation">'+
          '<a href="#"><strong>Hi, skinmaker!</strong></a>'+
          '<a href="#">Post</a>'+
          '<a href="#">Inbox (0)</a>'+
          '<a href="#">Log Out</a>'+
        '</nav>';

      const primary=document.createElement('nav');
      primary.className='ao3-nav ao3-primary-v54';
      primary.setAttribute('aria-label','Primary navigation');
      primary.innerHTML=
        '<a href="#">Fandoms</a>'+
        '<a href="#">Browse</a>'+
        '<a href="#">Search</a>'+
        '<a href="#">About</a>'+
        '<span class="ao3-header-search-v54"><input type="text" aria-label="Search works" placeholder="Search"><button type="button">Search</button></span>';

      const userLinks=document.createElement('nav');
      userLinks.className='ao3-user ao3-user-links-v54';
      userLinks.setAttribute('aria-label','Account shortcuts');
      userLinks.innerHTML=
        '<a href="#">Profile</a>'+
        '<a href="#">Dashboard</a>'+
        '<a href="#">Works</a>'+
        '<a href="#">Series</a>'+
        '<a href="#">Bookmarks</a>'+
        '<a href="#">History</a>'+
        '<a href="#">Marked for Later</a>'+
        '<a href="#">Subscriptions</a>'+
        '<a href="#">Preferences</a>';

      const resizeHandle=header.querySelector(':scope > .header-resize-handle');
      if(resizeHandle){
        header.insertBefore(mainRow,resizeHandle);
        header.insertBefore(primary,resizeHandle);
        header.insertBefore(userLinks,resizeHandle);
      }else{
        header.append(mainRow,primary,userLinks);
      }
    }

    return header;
  }

  function finishPreview(){
    ensureHeader();
    try{window.AO3TaxonomyStatsV51?.refresh?.()}catch(e){}
    try{window.AO3SeriesGlobalV53?.refresh?.()}catch(e){}
    try{window.AO3UniversalTextGradientsV52?.apply?.()}catch(e){}
    try{window.AO3InterfaceTitleIsolation?.apply?.()}catch(e){}
  }

  let finishFrame=0;
  function scheduleFinish(){
    if(finishFrame)return;
    finishFrame=requestAnimationFrame(()=>{
      finishFrame=0;
      finishPreview();
    });
  }

  document.addEventListener('click',e=>{
    if(e.target?.closest?.('.preview-page-btn,[data-page],.device-btn,[data-device]')){
      setTimeout(scheduleFinish,0);
    }
  },true);

  /* The preview page swaps only .ao3-main; this observer is intentionally shallow
     and coalesced so it does not become another source of editor lag. */
  const main=mock.querySelector('.ao3-main');
  if(main){
    const obs=new MutationObserver(scheduleFinish);
    obs.observe(main,{childList:true});
  }

  window.AO3PreviewRepairV54={refresh:scheduleFinish,ensureHeader};
  scheduleFinish();
})();
</script>
