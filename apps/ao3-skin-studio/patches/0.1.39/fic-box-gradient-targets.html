<style id="ao3-box-gradient-targets-styles">
.box-gradient-shortcut{
  margin-top:9px;
  display:flex;
  gap:7px;
  flex-wrap:wrap;
  align-items:center;
}
.box-gradient-shortcut button{
  border:1px solid #6b4b72;
  border-radius:6px;
  background:#171319;
  color:#eadfe7;
  padding:7px 9px;
  font-size:8px;
  font-weight:900;
  cursor:pointer;
}
.box-gradient-shortcut button:hover{background:#241c27}
.box-gradient-shortcut span{
  color:#958894;
  font-size:7px;
  line-height:1.4;
}
</style>

<script id="ao3-box-gradient-targets-script">
(function(){
  const q=id=>document.getElementById(id);
  const mock=q('mock');
  const target=q('gradientTarget');
  if(!mock || !target || typeof gradients==='undefined') return;

  const names={
    ficTextBox:'Fic Text Box',
    ficInfoBox:'Fic Info Box'
  };

  function defaultCfg(a,b){
    return {
      enabled:false,
      type:'linear',
      angle:'135deg',
      custom:'',
      stops:[
        {color:a,pos:0,opacity:100},
        {color:b,pos:100,opacity:100}
      ]
    };
  }

  if(!gradients.ficTextBox) gradients.ficTextBox=defaultCfg('#09090A','#261B18');
  if(!gradients.ficInfoBox) gradients.ficInfoBox=defaultCfg('#111014','#33231D');

  function addOption(value,label){
    if(target.querySelector('option[value="'+value+'"]')) return;
    const opt=document.createElement('option');
    opt.value=value;
    opt.textContent=label;
    const inputs=target.querySelector('option[value="inputs"]');
    if(inputs) inputs.insertAdjacentElement('afterend',opt);
    else target.appendChild(opt);
  }
  addOption('ficTextBox','Fic Text Box');
  addOption('ficInfoBox','Fic Info Box');

  function hexRgb(hex){
    let s=String(hex||'#000000').trim().replace('#','');
    if(s.length===3)s=s.split('').map(c=>c+c).join('');
    const n=parseInt(s.slice(0,6),16);
    return Number.isNaN(n)?[0,0,0]:[(n>>16)&255,(n>>8)&255,n&255];
  }
  function rgba(hex,a){
    const [r,g,b]=hexRgb(hex);
    return 'rgba('+r+','+g+','+b+','+Math.max(0,Math.min(1,a))+')';
  }

  /* Multiply the box opacity into each gradient color so the words/contents
     remain 100% opaque. This also handles pasted gradients using hex/rgb/rgba. */
  function alphaGradient(css,alpha){
    if(!css) return '';
    let out=String(css);
    out=out.replace(/rgba\(\s*(\d+(?:\.\d+)?)\s*,\s*(\d+(?:\.\d+)?)\s*,\s*(\d+(?:\.\d+)?)\s*,\s*(0?\.\d+|1(?:\.0+)?)\s*\)/gi,
      (_,r,g,b,a)=>'rgba('+r+','+g+','+b+','+(Number(a)*alpha).toFixed(4).replace(/0+$/,'').replace(/\.$/,'')+')');
    out=out.replace(/rgb\(\s*(\d+(?:\.\d+)?)\s*,\s*(\d+(?:\.\d+)?)\s*,\s*(\d+(?:\.\d+)?)\s*\)/gi,
      (_,r,g,b)=>'rgba('+r+','+g+','+b+','+alpha+')');
    out=out.replace(/#([0-9a-f]{6})(?![0-9a-f])/gi,(_,h)=>{
      const [r,g,b]=hexRgb('#'+h);
      return 'rgba('+r+','+g+','+b+','+alpha+')';
    });
    out=out.replace(/#([0-9a-f]{3})(?![0-9a-f])/gi,(_,h)=>{
      const [r,g,b]=hexRgb('#'+h);
      return 'rgba('+r+','+g+','+b+','+alpha+')';
    });
    return out;
  }

  function gradientFor(key,alpha){
    const cfg=gradients[key];
    if(!cfg?.enabled) return '';
    let css='';
    try{css=gradientCssFor(key)}catch(e){}
    return alphaGradient(css,alpha);
  }

  function applyBoxGradients(){
    const ficAlpha=Math.max(0,Math.min(1,Number(q('ficBoxOpacity')?.value||82)/100));
    const infoAlpha=Math.max(0,Math.min(1,Number(q('ficMetaBoxOpacity')?.value||88)/100));
    const ficGrad=gradientFor('ficTextBox',ficAlpha);
    const infoGrad=gradientFor('ficInfoBox',infoAlpha);

    mock.querySelectorAll('.preview-fic-chapter').forEach(el=>{
      if(q('ficBoxEnabled')?.checked!==true) return;
      if(ficGrad){
        el.style.setProperty('background',ficGrad,'important');
        el.style.setProperty('background-color','transparent','important');
        el.style.setProperty('opacity','1','important');
      }
    });

    mock.querySelectorAll('.preview-fic-meta').forEach(el=>{
      if(q('ficMetaBoxEnabled')?.checked!==true) return;
      if(infoGrad){
        el.style.setProperty('background',infoGrad,'important');
        el.style.setProperty('background-color','transparent','important');
        el.style.setProperty('opacity','1','important');
      }
    });
  }

  /* Gradient Studio's older status labels don't know these two new targets. */
  function fixStatus(){
    if(!names[currentGradientTarget]) return;
    const cfg=gradients[currentGradientTarget];
    const status=q('gradientTargetStatus');
    if(status) status.textContent=names[currentGradientTarget]+': '+(cfg?.enabled?'gradient ON':'gradient off');
  }

  try{
    const oldRender=renderGradientEditor;
    renderGradientEditor=function(){
      oldRender.apply(this,arguments);
      fixStatus();
    };
  }catch(e){}

  try{
    const oldStrip=updateGradientPreviewStrip;
    updateGradientPreviewStrip=function(){
      oldStrip.apply(this,arguments);
      fixStatus();
      applyBoxGradients();
    };
  }catch(e){}

  function shortcut(boxId,key){
    const box=q(boxId);
    if(!box || box.querySelector('.box-gradient-shortcut')) return;
    const row=document.createElement('div');
    row.className='box-gradient-shortcut';
    row.innerHTML='<button type="button">Edit Gradient</button><span>Use Gradient Studio for linear, radial, conic, multi-stop, metallic, or pasted CSS gradients.</span>';
    box.appendChild(row);
    row.querySelector('button').addEventListener('click',()=>{
      currentGradientTarget=key;
      target.value=key;
      try{renderGradientEditor()}catch(e){}
      try{window.AO3WorkspaceTabs?.show?.('gradient')}catch(e){}
    });
  }
  shortcut('ficReadingBoxControls','ficTextBox');
  shortcut('ficMetaBoxControls','ficInfoBox');

  document.addEventListener('input',e=>{
    if(e.target?.closest?.('#gradientStops,#gradientRadialControls,#gradientConicControls') ||
       e.target?.closest?.('#ficReadingBoxControls,#ficMetaBoxControls') ||
       e.target===q('gradientEnabled') || e.target===q('gradientType') ||
       e.target===q('gradientAngle') || e.target===q('gradientPaste')){
      setTimeout(applyBoxGradients,0);
    }
  },true);
  document.addEventListener('change',e=>{
    if(e.target?.closest?.('#gradientStops,#gradientRadialControls,#gradientConicControls') ||
       e.target?.closest?.('#ficReadingBoxControls,#ficMetaBoxControls') ||
       e.target===q('gradientEnabled') || e.target===q('gradientType') ||
       e.target===q('gradientAngle') || e.target===target){
      setTimeout(()=>{applyBoxGradients();fixStatus()},0);
    }
  },true);
  document.addEventListener('click',e=>{
    if(e.target?.closest?.('#gradientAddStop,#gradientEven,#gradientReverse,#gradientApplyPaste,#gradientUseBuilder,#gradientRotateMinus15,#gradientRotatePlus15,#gradientRotate90,#gradientFlipDirection,.preview-page-btn,[data-page]')){
      setTimeout(applyBoxGradients,0);
    }
  },true);

  const obs=new MutationObserver(()=>requestAnimationFrame(applyBoxGradients));
  obs.observe(mock,{childList:true,subtree:true});

  /* Final CSS export: use the box gradient if enabled; otherwise the existing
     solid box export remains in place. */
  try{
    const oldBuildCss=buildCss;
    buildCss=function(){
      let css=oldBuildCss.apply(this,arguments);
      const ficAlpha=Math.max(0,Math.min(1,Number(q('ficBoxOpacity')?.value||82)/100));
      const infoAlpha=Math.max(0,Math.min(1,Number(q('ficMetaBoxOpacity')?.value||88)/100));
      const ficGrad=gradientFor('ficTextBox',ficAlpha);
      const infoGrad=gradientFor('ficInfoBox',infoAlpha);

      if(q('ficBoxEnabled')?.checked===true && ficGrad){
        css+='\n\n/* FIC TEXT BOX GRADIENT — FINAL */\n'+
          '#chapters .userstuff, .chapter .userstuff {\n'+
          '  background:'+ficGrad+' !important;\n'+
          '  opacity:1 !important;\n}\n';
      }
      if(q('ficMetaBoxEnabled')?.checked===true && infoGrad){
        css+='\n/* FIC INFO BOX GRADIENT — FINAL */\n'+
          '.work.meta.group, dl.work.meta.group {\n'+
          '  background:'+infoGrad+' !important;\n'+
          '  opacity:1 !important;\n}\n';
      }
      return css;
    };
  }catch(e){}

  /* If a loaded project already contains these targets, keep them. Otherwise
     they were created above and will be included in normal project/skin saves. */
  setTimeout(()=>{
    try{renderGradientEditor()}catch(e){}
    applyBoxGradients();
    fixStatus();
  },80);

  window.AO3BoxGradients={
    apply:applyBoxGradients,
    select:function(key){
      if(!names[key])return;
      currentGradientTarget=key;
      target.value=key;
      renderGradientEditor();
    }
  };
})();
</script>
