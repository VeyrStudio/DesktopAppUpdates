<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Replay Media</title><style>html,body{margin:0;width:100%;height:100%;background:#101014;color:#e7d6b7;font:14px 'Lucida Sans',sans-serif}body{display:flex;flex-direction:column}header{padding:10px 14px;display:flex;align-items:center;gap:12px;background:#2a101d;border-bottom:1px solid #9d7842}#title{overflow:hidden;white-space:nowrap;text-overflow:ellipsis;flex:1}button,select{background:#3b2030;color:#ead3a7;border:1px solid #967344;border-radius:6px;padding:7px;cursor:pointer}main{flex:1;min-height:0;overflow:auto;display:flex;align-items:center;justify-content:center}video,img{max-width:100%;max-height:100%;object-fit:contain}video{width:100%;height:100%}#image{cursor:zoom-in;transform-origin:center}#tools{display:flex;gap:6px}#status{padding:4px 12px;color:#c6a97a;font-size:12px}#stage{display:flex;align-items:center;justify-content:center;width:100%;height:100%;overflow:auto}</style></head><body><header><strong>Replay</strong><span id="title">Media</span><div id="tools"><button id="zoom-out" hidden>−</button><button id="zoom-in" hidden>+</button><button id="reset" hidden>Fit</button><button id="gif-pause" hidden>Pause GIF</button></div></header><main><div id="stage"></div></main><div id="status"></div><script src="media-window.js"></script></body></html>
